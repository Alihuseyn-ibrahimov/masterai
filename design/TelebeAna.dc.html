<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #F7F8FA; color: #12151C; }
    a { color: #2F6FED; text-decoration: none; }
    a:hover { color: #2358C7; }
    h1, h2, h3, h4 { font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; margin: 0; line-height: 1.2; }
    p { margin: 0; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; height: 844px; background: #F7F8FA;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E7EE;">
    <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 800;">Master<span style="color: #2F6FED;">AI</span></span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; background: #FDF0D2; color: #8A5A00; font-size: 12px; font-weight: 700;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c0 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-3s3 2 3 6a7 7 0 1 1-14 0c0-6 8-8 8-12"/></svg>
        4 gün
      </span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #E8F0FE; color: #2F6FED; font-size: 14px; font-weight: 700;">Ə</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="font-size: 28px; font-weight: 800;">Salam, Əli</h1>
      <p style="font-size: 14px; color: #5B6472;">Bu həftə 3 tapşırıq gözləyir</p>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 16px;">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#F1F3F7" stroke-width="8"/>
        <circle cx="36" cy="36" r="30" fill="none" stroke="#2F6FED" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="188.5" stroke-dashoffset="60" transform="rotate(-90 36 36)"/>
        <text x="36" y="41" text-anchor="middle" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#12151C">68%</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
        <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700;">Ümumi nəticəniz</span>
        <span style="font-size: 14px; color: #5B6472;">Son 12 testdə 82 düzgün cavab</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <h2 style="font-size: 18px; font-weight: 700;">Tapşırıqlarım</h2>
        <span style="font-size: 12px; color: #5B6472;">Hamısı</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-left: 4px solid #C62828; border-radius: 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: #FCE4E2; color: #C62828; font-size: 12px; font-weight: 600;">Qanunvericilik</span>
          <span style="font-size: 12px; color: #8A5A00; font-weight: 600;">Sabaha qədər</span>
        </div>
        <h3 style="font-size: 18px; font-weight: 700; text-wrap: pretty;">Dövlət qulluğu haqqında qanun</h3>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #F1F3F7; overflow: hidden;">
            <div style="width: 40%; height: 100%; border-radius: 999px; background: #C62828;"></div>
          </div>
          <span style="font-size: 12px; color: #5B6472;">4/10</span>
        </div>
        <span style="display: inline-flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #2F6FED; color: #FFFFFF; font-size: 16px; font-weight: 600;">Davam et</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-left: 4px solid #7C4DFF; border-radius: 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <span style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: #F1EBFF; color: #7C4DFF; font-size: 12px; font-weight: 600;">Məntiq</span>
          <span style="font-size: 12px; color: #5B6472;">3 gün qalıb</span>
        </div>
        <h3 style="font-size: 18px; font-weight: 700; text-wrap: pretty;">Ardıcıllıqlar və sxemlər</h3>
        <span style="display: inline-flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9D0DC; color: #12151C; font-size: 16px; font-weight: 600;">Başla</span>
      </div>
    </div>

  </div>

  <div style="display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #FFFFFF; border-top: 1px solid #E3E7EE;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 60px; color: #5B6472;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size: 12px;">Çatlar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 60px; color: #2F6FED;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6"/></svg>
      <span style="font-size: 12px; font-weight: 600;">Tapşırıqlar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 60px; color: #5B6472;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 5-6"/></svg>
      <span style="font-size: 12px;">Tarixçə</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 60px; color: #5B6472;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
      <span style="font-size: 12px;">Profil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
