<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #F7F8FA; color: #12151C; }
    a { color: #2F6FED; text-decoration: none; }
    a:hover { color: #2358C7; }
    h1, h2, h3, h4 { font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; margin: 0; line-height: 1.2; }
    p { margin: 0; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; height: 844px; background: #F7F8FA;">

  <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E3E7EE;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12151C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700;">Nailiyyətlərim</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 16px;">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#F1F3F7" stroke-width="10"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="#2F6FED" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="251.3" stroke-dashoffset="100.5" transform="rotate(-90 48 48)"/>
        <text x="48" y="45" text-anchor="middle" font-family="Nunito, sans-serif" font-size="26" font-weight="800" fill="#12151C">3</text>
        <text x="48" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8A93A3">/ 5</text>
      </svg>
      <span style="font-size: 14px; color: #5B6472;">Nişan qazanılıb</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 16px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; background: #DCF5E7;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1E7A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-3 7-6.5 7-11a7 7 0 0 0-14 0c0 4.5 3 8 7 11"/><path d="M12 12v-2"/></svg>
        </span>
        <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;">İlk addım</span>
        <span style="font-size: 12px; color: #8A93A3; text-align: center;">01 sen 2026</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 16px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; background: #E8F0FE;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>
        </span>
        <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;">Yüz faiz</span>
        <span style="font-size: 12px; color: #8A93A3; text-align: center;">05 sen 2026</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; background: #FFFFFF; border: 1px solid #E3E7EE; border-radius: 16px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; background: #FDF0D2;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c0 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-3s3 2 3 6a7 7 0 1 1-14 0c0-6 8-8 8-12"/></svg>
        </span>
        <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;">Silsilə</span>
        <span style="font-size: 12px; color: #8A93A3; text-align: center;">09 sen 2026</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; background: #F1F3F7; border: 1px dashed #C9D0DC; border-radius: 16px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; background: #E3E7EE;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #5B6472;">Fənn ustası</span>
        <span style="font-size: 12px; color: #8A93A3; text-align: center;">Bir fənndən 5 tapşırıq</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; background: #F1F3F7; border: 1px dashed #C9D0DC; border-radius: 16px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; background: #E3E7EE;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #5B6472;">Sürətli əqli</span>
        <span style="font-size: 12px; color: #8A93A3; text-align: center;">3 dəqiqədən tez bitir</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
