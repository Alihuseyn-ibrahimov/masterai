<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canlı sessiya - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031b" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031b">
<link rel="stylesheet" href="assets/css/base.css?v=20261031b">
<link rel="stylesheet" href="assets/css/components.css?v=20261031b">
</head>
<body>
<header id="appBar"></header>
<!-- Ev tapşırığı ekranı ilə EYNİ quruluş (`tapsiriq.html`): tələbə
     sessiya bitəndən sonra naviqasiyasız qalmamalıdır. -->
<div class="container app-shell stack stack--loose">

  <section class="stack quiz-shell">
    <div class="section-header">
      <h1>Canlı sessiya</h1>
      <a class="btn btn--ghost btn--sm" href="chatlar.html">← Çatlar</a>
    </div>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

    <!-- PIN forması QƏSDƏN YOXDUR: tələbə çatdakı «Qoşul» düyməsindən
         gəlir, üzvlüyü isə server çatdan yoxlayır. Yazılacaq heç nə
         yoxdur - ad da hesabdan götürülür. -->

    <!-- 1. Gözləmə -->
    <div class="card stack" id="waitCard" style="text-align: center">
      <div class="spinner" style="margin: 0 auto"></div>
      <h3>Qoşuldunuz</h3>
      <p class="text-sm text-muted">Müəllim sessiyanı başladanda suallar görünəcək.</p>
    </div>

    <!-- 2. Sual
         `--quiz-accent` fənn rəngini ötürür: tərəqyi seqmentləri və
         xal dairəsi ondan rəng alır. Fənn bilinməsə əsas rəng işləyir. -->
    <div class="card stack" id="questionCard" hidden>
      <div class="quiz-head">
        <span class="quiz-counter" id="questionCounter">Sual</span>
        <span class="quiz-timer" id="countdown">-</span>
      </div>
      <!-- Sual-sual tərəqqi: zolaq yox, SEQMENT. «7-dən 5-ini
           bitirdin» məlumatı imtahan hazırlığında faizdən faydalıdır. -->
      <div id="quizSteps" class="quiz-steps" aria-hidden="true"></div>
      <h2 class="quiz-question" id="questionText"></h2>
      <div id="options" class="option-list"></div>
    </div>

    <!-- 3. Nəticə
         Əsas mesaj `verdict` blokudur - əvvəl kiçik bir nişan idi və
         düzgün/səhv hissini ötürmürdü. -->
    <div class="card stack" id="resultCard" hidden>
      <div class="verdict" id="verdict">
        <span class="verdict__icon" id="verdictIcon" aria-hidden="true"></span>
        <span class="stack stack--tight">
          <span class="verdict__title" id="verdictTitle"></span>
          <span class="verdict__note" id="verdictNote"></span>
        </span>
      </div>
      <!-- Ardıcıl düzgün cavab. İKİDƏN başlayaraq görünür. -->
      <div class="row"><span class="streak" id="streak" hidden></span></div>
      <!-- Sual mətni təkrarlanır: izah suala istinad edir, sual isə
           artıq ekrandan getmişdi. -->
      <p class="text-sm text-muted" id="resultQuestion"></p>
      <p id="chosenText" hidden></p>
      <p id="correctText"></p>
      <p class="text-sm text-muted" id="explanationText"></p>
      <button class="btn btn--primary btn--block btn--lg" type="button" id="nextBtn">Növbəti sual</button>
    </div>

    <!-- 4. Şəxsi bitiş
         Xal dairəsi `conic-gradient` ilə çəkilir - SVG və ya kitabxana
         yoxdur, «build addımı yoxdur» qaydası qorunur. -->
    <div class="card stack stack--center" id="personalCard" hidden>
      <div class="score-ring" id="scoreRing">
        <div class="score-ring__inner">
          <span class="score-ring__value" id="scoreRingValue">-</span>
        </div>
      </div>
      <span class="score-ring__label" id="scoreRingLabel"></span>
      <h3>Siz bitirdiniz</h3>
      <p id="personalScore"></p>
      <p class="text-sm text-muted">Sessiya bitəndə ümumi nəticələr görünəcək.</p>
    </div>

    <!-- 5. Sessiya bitdi -->
    <div class="card stack" id="finishedCard" hidden>
      <h3>Sessiya bitdi</h3>
      <div id="leaderboard"></div>
    </div>

  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { getToken } from './assets/js/api.js';
  import { LivePlaySocket } from './assets/js/live-socket.js';
  import { PlayScreen } from './assets/js/live-play-screen.js?v=20261031b';
  import { mountShell, requireLogin } from './assets/js/page-shell.js';

  /* Giriş MƏCBURİDİR: server tokensiz bağlantını 4401 ilə bağlayır
     (anonim yol silinir) və iştirakçı hesaba bağlanmasa nəticə
     tələbənin tarixçəsinə düşmür. */
  if (requireLogin()) {
    mountShell();

    const sessionId = Number(new URLSearchParams(window.location.search).get('id'));

    let socket = null;
    const screen = new PlayScreen({
      root: document,
      onNext: () => {
        if (!socket.next()) screen.showError('Bağlantı hazır deyil - bir azdan cəhd edin.');
      },
    });

    if (!Number.isInteger(sessionId) || sessionId <= 0) {
      screen.showError('Sessiya ünvanı düzgün deyil. Çatdakı «Qoşul» düyməsindən keçin.');
      document.getElementById('waitCard').hidden = true;
    } else {
      /* QOŞULMA GÖZƏTÇİSİ. REAL HADİSƏ (2026-09-12): handshake 403
         alırdı, 403 isə «fatal» sayılmadığı üçün `ReconnectingSocket`
         sonsuz cəhd edir və status `reconnecting` qalır - `closed`
         HEÇ VAXT gəlmir. Nəticədə tələbə spinnerə baxıb gözləyirdi,
         ekranda isə heç bir izah yox idi.

         İndi müəyyən müddət ərzində `joined` gəlməsə, aydın və
         ƏMƏLİ mesaj göstərilir. */
      const JOIN_TIMEOUT_MS = 12000;
      let joined = false;
      const joinGuard = setTimeout(() => {
        if (joined) return;
        screen.showError(
          'Sessiyaya qoşulmaq alınmadı. Səhifəni Ctrl+Shift+R ilə yeniləyin '
          + '(telefonda: brauzeri bağlayıb yenidən açın). Problem davam edərsə '
          + 'müəllimə deyin - sessiya bağlanmış ola bilər.',
        );
      }, JOIN_TIMEOUT_MS);

      socket = new LivePlaySocket({
        sessionId,
        token: getToken() || '',
        onStatus: (status) => {
          if (status === 'closed') {
            // Səbəb koduna görə mətn fərqlənmir, çünki server rədd
            // səbəbini AYRICA `error` mesajı ilə göndərir (bax
            // `_reject_websocket`) və o, `screen.handle`-a düşür.
            clearTimeout(joinGuard);
            screen.showError('Bağlantı bağlandı. Çata qayıdıb yenidən qoşulun.');
          }
        },
        onMessage: (data) => {
          if (data && data.type === 'joined') {
            joined = true;
            clearTimeout(joinGuard);
            screen.clearError();
          }
          screen.handle(data);
        },
      });
      screen.onAnswer = (index, chosen) => socket.answer(index, chosen);
      socket.connect();
    }

    window.addEventListener('beforeunload', () => { if (socket) socket.close(); });
  }
</script>
</body>
</html>
