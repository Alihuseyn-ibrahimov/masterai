<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapşırıq - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261103a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261103a">
<link rel="stylesheet" href="assets/css/base.css?v=20261103a">
<link rel="stylesheet" href="assets/css/components.css?v=20261103a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack quiz-shell">
    <div class="section-header">
      <h1>Ev tapşırığı</h1>
      <a class="btn btn--ghost btn--sm" href="tapsiriqlar.html">← Tapşırıqlar</a>
    </div>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>
    <div id="loading"><div class="state"><div class="spinner"></div>
      <div class="state__text">Yüklənir…</div></div></div>

    <!-- Reading bankı: mətn sualların ÜSTÜNDƏ və cavab verərkən də görünür.
         Açılıb-bağlanan blokdur: uzun mətn telefonda sualı aşağı itələyir. -->
    <details class="disclosure" id="passageCard" open hidden>
      <summary class="disclosure__summary">Mətn</summary>
      <div class="disclosure__body">
        <p class="passage__text" id="passageText"></p>
      </div>
    </details>

    <div class="card stack" id="questionCard" hidden>
      <div class="quiz-head">
        <span class="quiz-counter" id="counter">Sual</span>
        <span class="quiz-timer" id="scoreLabel"></span>
      </div>
      <!-- Sual-sual seqment: canlı sessiya ilə EYNİ komponent.
           Əvvəl burada faiz zolağı idi; seqment «nə qədər qaldı»
           sualına daha düz cavab verir. -->
      <div id="quizSteps" class="quiz-steps" aria-hidden="true"></div>
      <h2 class="quiz-question" id="questionText"></h2>
      <div id="options" class="option-list"></div>

      <!-- Sokratik köməkçi (Faza 2 PR 1): YALNIZ ev tapşırığında.
           Variant seçmək bura HƏLƏ cavabı göndərmir - tələbə əvvəlcə
           "Kömək istə" ilə yoxlaya, sonra "Cavabı göndər" ilə son
           cəhdini edə bilər. Canlı sinif quizində (sessiya.html) bu
           əlavə addım QƏSDƏN yoxdur - vaxt itkisinə səbəb olardı. -->
      <div class="row">
        <button class="btn btn--secondary btn--sm" type="button" id="hintBtn" disabled>Kömək istə</button>
        <button class="btn btn--primary btn--sm" type="button" id="submitBtn" disabled>Cavabı göndər</button>
      </div>
      <div id="hintSlot"></div>
      <div class="notice notice--info row row--tight" id="hintArea" hidden>
        <span class="mascot" id="hintMascot" data-mascot="surprised" aria-hidden="true"></span>
        <p class="text-sm" id="hintText"></p>
      </div>
    </div>

    <div class="card stack" id="feedbackCard" hidden>
      <!-- Nişan `row`-un içindədir: `stack` sütununda tək element bütün
           eni tutur və rəngli zolağa çevrilir. -->
      <div class="verdict" id="verdict">
        <span class="verdict__icon" id="verdictIcon" aria-hidden="true"></span>
        <span class="stack stack--tight">
          <span class="verdict__title" id="verdictTitle"></span>
          <span class="verdict__note" id="verdictNote"></span>
        </span>
        <span class="mascot verdict__mascot" id="verdictMascot" data-mascot="idle"></span>
      </div>
      <div class="row"><span class="xp-pop" id="xpPop" hidden></span><span class="streak" id="streak" hidden></span></div>
      <!-- Sual mətni geri bildirimdə TƏKRARLANIR: izah suala istinad
           edir, sual isə artıq ekrandan getmişdi. -->
      <p class="text-sm text-muted" id="feedbackQuestion"></p>
      <p id="chosenText" hidden></p>
      <p id="correctText"></p>
      <p class="text-sm text-muted" id="explanationText"></p>
      <button class="btn btn--primary btn--block" type="button" id="nextBtn">Növbəti sual</button>
    </div>

    <div class="card stack stack--center" id="doneCard" hidden>
      <span class="mascot finish__mascot" id="finishMascot" data-mascot="idle"></span>
      <div class="score-ring" id="scoreRing">
        <div class="score-ring__inner">
          <span class="score-ring__value" id="scoreRingValue">-</span>
        </div>
      </div>
      <span class="score-ring__label" id="scoreRingLabel"></span>
      <span class="xp-pop" id="finishXp" hidden></span>
      <p class="finish__line" id="finishLine" hidden></p>
      <h3>Tapşırıq tamamlandı</h3>
      <p id="finalScore"></p>
      <a class="btn btn--secondary" href="tapsiriqlar.html">Tapşırıqlara qayıt</a>
    </div>

    <!-- Yazılı hissə (Faza 1, PR 2): bankın açıq sualları test bitəndən
         sonra görünür. AI balı təklif edir, yekun balı müəllim verir. -->
    <section class="stack" id="writtenSection" hidden>
      <div class="section-header"><h2>Yazılı hissə</h2></div>
      <p class="text-sm text-muted">Cavabı öz sözlərinizlə yazın. Hər suala bir dəfə cavab verilir.</p>
      <div class="stack" id="writtenList"></div>
    </section>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { mountShell, requireLogin } from './assets/js/page-shell.js';
  import { answerFeedback, scoreLine } from './assets/js/answer-feedback.js';
  import { createIcon } from './assets/js/icon.js';
  import { celebrateFinish, reactToAnswer } from './assets/js/celebrate.js';
  import { createThinking, mountMascots, setMascotState } from './assets/js/mascot.js';
  import { answerStatusLine, criterionLine, kindLabel } from './assets/js/open-questions.js';
  /* Variant çəkilişi canlı sessiya ilə EYNİ modulda - əvvəl hər iki
     ekran onu ayrı-ayrı yazırdı və ikisi də `btn btn--secondary`
     işlədirdi (ekranda beş boz düymə). */
  import {
    markChosen, renderOptions, renderSteps, resetOptions, revealAnswer,
  } from './assets/js/quiz-options.js';


  if (requireLogin()) {
    mountShell();
    mountMascots();

    const assignmentId = Number(new URLSearchParams(window.location.search).get('id'));
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const cards = {
      question: document.getElementById('questionCard'),
      feedback: document.getElementById('feedbackCard'),
      done: document.getElementById('doneCard'),
    };

    const passageCard = document.getElementById('passageCard');
    const show = (name) => {
      loading.hidden = true;
      for (const [key, card] of Object.entries(cards)) card.hidden = key !== name;
      passageCard.hidden = !document.getElementById('passageText').textContent || name === 'done';
    };
    const showError = (text) => {
      loading.hidden = true;
      errorBox.textContent = text;
      errorBox.hidden = false;
    };

    let attemptId = null;
    let score = 0;
    let pendingQuestion = null;
    /* Geri bildirim kartı düzgün cavabın MƏTNİNİ göstərməlidir, amma
       server yalnız indeks qaytarır (`HomeworkAnswerResult`) - variant
       mətnləri yalnız burada, cari sualda var. */
    let currentQuestion = null;
    let optionButtons = [];
    /* Ardıcıl düzgün cavab - İKİDƏN başlayaraq göstərilir. */
    let streak = 0;
    /* Toxunulan variant HƏLƏ cavab deyil - "Kömək istə"/"Cavabı göndər"
       bu indeksə görə işləyir (bax yuxarı HTML qeydi). */
    let selectedIndex = null;

    const hintBtn = document.getElementById('hintBtn');
    const submitBtn = document.getElementById('submitBtn');
    const hintArea = document.getElementById('hintArea');
    const hintSlot = document.getElementById('hintSlot');

    function hideHint() {
      hintArea.hidden = true;
      hintSlot.replaceChildren();
    }

    function updateActionButtons() {
      const has = selectedIndex !== null;
      hintBtn.disabled = !has;
      submitBtn.disabled = !has;
    }

    function selectOption(index) {
      selectedIndex = index;
      optionButtons.forEach((button, i) => {
        button.classList.toggle('option--chosen', i === index);
      });
      hideHint();
      updateActionButtons();
    }

    function renderQuestion(question) {
      currentQuestion = question;
      selectedIndex = null;
      hideHint();
      document.getElementById('counter').textContent =
        `Sual ${question.index + 1}/${question.total}`;
      renderSteps(document.getElementById('quizSteps'), {
        total: question.total, currentIndex: question.index,
      });
      document.getElementById('scoreLabel').textContent = `${score} düzgün`;
      document.getElementById('questionText').textContent = question.question;

      optionButtons = renderOptions(
        document.getElementById('options'), question.options,
        (index) => selectOption(index),
      );
      updateActionButtons();
      show('question');
    }

    async function askHint() {
      if (selectedIndex === null || !currentQuestion) return;
      hintBtn.disabled = true;
      submitBtn.disabled = true;
      hintArea.hidden = true;
      hintSlot.replaceChildren(createThinking('AI köməkçi düşünür…'));
      try {
        const result = await request(`/homework/attempts/${attemptId}/hint`, {
          method: 'POST',
          body: { question_index: currentQuestion.index, chosen_index: selectedIndex },
        });
        hintSlot.replaceChildren();
        if (result.is_correct) {
          setMascotState(document.getElementById('hintMascot'), 'happy');
          document.getElementById('hintText').textContent =
            'Düz yoldasınız. "Cavabı göndər" düyməsinə basa bilərsiniz.';
        } else {
          setMascotState(document.getElementById('hintMascot'), 'surprised');
          document.getElementById('hintText').textContent =
            result.hint || 'Materialı bir daha diqqətlə oxuyun.';
        }
        hintArea.hidden = false;
      } catch (error) {
        hintSlot.replaceChildren();
        showError(error.message);
      } finally {
        updateActionButtons();
      }
    }

    hintBtn.addEventListener('click', askHint);
    submitBtn.addEventListener('click', () => {
      if (selectedIndex !== null) submitAnswer(currentQuestion.index, selectedIndex);
    });

    function renderFeedback(result, chosenIndex) {
      const feedback = answerFeedback({
        options: currentQuestion && currentQuestion.options,
        correctIndex: result.correct_index,
        chosenIndex,
        isCorrect: result.is_correct,
      });
      /* Nəticə variantların ÜSTÜNDƏ də görünür - tələbə seçdiyini və
         düzgününü yan-yana oxuyur. */
      revealAnswer(optionButtons, {
        correctIndex: result.correct_index, chosenIndex,
      });

      streak = result.is_correct ? streak + 1 : 0;
      const verdict = document.getElementById('verdict');
      verdict.className = `verdict verdict--${result.is_correct ? 'correct' : 'wrong'}`;
      document.getElementById('verdictIcon')
        .replaceChildren(createIcon(result.is_correct ? 'check' : 'x', 'icon--lg'));
      document.getElementById('verdictTitle').textContent =
        result.is_correct ? 'Düzgün' : 'Səhv';
      document.getElementById('verdictNote').textContent = result.is_correct
        ? 'Davam et - növbəti sual gözləyir.'
        : 'İzahı oxu, növbəti sualda işinə yarayacaq.';

      reactToAnswer(document, result.is_correct);

      const streakEl = document.getElementById('streak');
      streakEl.hidden = streak < 2;
      streakEl.textContent = `${streak} ardıcıl düzgün`;
      document.getElementById('feedbackQuestion').textContent =
        currentQuestion ? currentQuestion.question : '';
      const chosen = document.getElementById('chosenText');
      chosen.textContent = feedback.chosenLine || '';
      chosen.hidden = !feedback.chosenLine;
      document.getElementById('correctText').textContent = feedback.correctLine;
      document.getElementById('explanationText').textContent = result.explanation || '';

      pendingQuestion = result.next_question;
      // `next_question === null` - bu, sonuncu sual idi (bax
      // `HomeworkAnswerResult`, models.py).
      document.getElementById('nextBtn').textContent =
        pendingQuestion ? 'Növbəti sual' : 'Nəticəni gör';
      show('feedback');
    }

    async function submitAnswer(questionIndex, chosenIndex) {
      // İkiqat toxunuş serverdə "artıq cavablanıb" xətası verir və
      // istifadəçi səbəbini anlamır.
      markChosen(optionButtons, chosenIndex);
      hintBtn.disabled = true;
      submitBtn.disabled = true;
      hideHint();
      try {
        const result = await request(`/homework/attempts/${attemptId}/answer`, {
          method: 'POST',
          body: { question_index: questionIndex, chosen_index: chosenIndex },
        });
        if (result.is_correct) score += 1;
        renderFeedback(result, chosenIndex);
      } catch (error) {
        showError(error.message);
        resetOptions(optionButtons);
        if (selectedIndex !== null) optionButtons[selectedIndex]?.classList.add('option--chosen');
        updateActionButtons();
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (pendingQuestion) {
        renderQuestion(pendingQuestion);
        pendingQuestion = null;
      } else {
        finishAttempt();
      }
    });

    /* Yekun nəticənin MƏXRƏCİ: `total` sonuncu sualdan gəlir, çünki
       cavab nəticəsi (`HomeworkAnswerResult`) onu daşımır. */
    function finishAttempt(total) {
      const questions = total ?? (currentQuestion && currentQuestion.total) ?? 0;
      document.getElementById('finalScore').textContent = scoreLine(score, questions);
      /* Xal dairəsi. Məxrəc sıfır olsa faiz hesablanmır - uydurma 0%
         göstərmək yanlış olardı (bax `scoreLine`-ın eyni qaydası). */
      if (questions) {
        const pct = Math.round((score / questions) * 100);
        document.getElementById('scoreRing').style.setProperty('--pct', String(pct));
        document.getElementById('scoreRingLabel').textContent = `${pct}% düzgün`;
      }
      show('done');
      celebrateFinish(document, score, questions);
      loadWritten();
    }

    /* ---- Yazılı hissə ---- */
    const POLL_MS = 4000;
    let writtenTimer = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function loadWritten() {
      clearTimeout(writtenTimer);
      let items;
      try {
        items = await request(`/homework/attempts/${attemptId}/open-questions`);
      } catch {
        return;   // yazılı hissə köməkçidir, testin nəticəsini gizlətməsin
      }
      const section = document.getElementById('writtenSection');
      section.hidden = !items.length;
      document.getElementById('writtenList').replaceChildren(
        ...items.map((item, index) => renderWritten(item, index + 1)),
      );
      if (items.some((item) => item.answer && item.answer.status === 'grading')) {
        writtenTimer = setTimeout(loadWritten, POLL_MS);
      }
    }

    function renderWritten(item, number) {
      const card = el('article', 'card stack');
      const head = el('div', 'row row--between');
      const badges = el('div', 'row');
      badges.append(el('span', 'badge badge--neutral', kindLabel(item.kind)),
        el('span', 'text-xs text-muted', `${item.max_points} bal`));
      head.append(el('strong', '', `${number}.`), badges);
      card.append(head, el('p', '', item.question));

      const answer = item.answer;
      if (!answer) {
        const form = el('form', 'stack');
        const area = el('textarea', 'field__textarea');
        area.rows = item.kind === 'esse' ? 7 : 3;
        area.maxLength = 5000;
        area.setAttribute('aria-label', `${number}-ci sualın cavabı`);
        const send = el('button', 'btn btn--primary btn--sm', 'Cavabı göndər');
        send.type = 'submit';
        form.append(area, send);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!area.value.trim()) return;
          send.disabled = true;
          try {
            await request(`/homework/attempts/${attemptId}/open-answers`, {
              method: 'POST', body: { open_question_id: item.open_question_id, answer: area.value },
            });
            loadWritten();
          } catch (error) {
            showError(error.message);
            send.disabled = false;
          }
        });
        card.append(form);
        return card;
      }

      card.append(el('p', 'text-sm text-muted', `Cavabınız: ${answer.answer}`));
      if (answer.status === 'grading') {
        card.append(createThinking(answerStatusLine(answer)));
        return card;
      }
      card.append(el('p', answer.status === 'confirmed' ? 'finish__line' : 'text-sm', answerStatusLine(answer)));
      if (answer.teacher_comment) card.append(el('p', 'text-sm', `Müəllim: ${answer.teacher_comment}`));
      if (answer.feedback) card.append(el('p', 'text-sm', answer.feedback));
      if (answer.criteria.length) {
        const list = el('ul', 'text-sm');
        for (const grade of answer.criteria) list.append(el('li', '', criterionLine(grade)));
        card.append(list);
      }
      if (answer.model_answer) {
        const sample = el('details', 'disclosure');
        sample.append(el('summary', 'disclosure__summary', 'Nümunə cavab'),
          el('p', 'disclosure__body text-sm', answer.model_answer));
        card.append(sample);
      }
      return card;
    }

    if (!Number.isInteger(assignmentId) || assignmentId <= 0) {
      showError('Tapşırıq ünvanı düzgün deyil.');
    } else {
      request(`/homework/assignments/${assignmentId}/start`, { method: 'POST' })
        .then((state) => {
          attemptId = state.attempt_id;
          score = state.score || 0;
          if (state.passage) document.getElementById('passageText').textContent = state.passage;
          if (!state.question) {
            // Cəhd artıq tamamlanıb - göstəriləcək sual yoxdur. Ümumi
            // sual sayı da yoxdur, ona görə faiz uydurulmur.
            finishAttempt(0);
            return;
          }
          renderQuestion(state.question);
        })
        .catch((error) => showError(error.message));
    }
  }
</script>
</body>
</html>
