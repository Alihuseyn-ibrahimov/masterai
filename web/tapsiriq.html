<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapşırıq - MasterAI</title>
<meta name="theme-color" content="#2F6FED">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack">
    <div class="section-header">
      <h1>Ev tapşırığı</h1>
      <a class="btn btn--ghost btn--sm" href="tapsiriqlar.html">← Tapşırıqlar</a>
    </div>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>
    <div id="loading"><div class="state"><div class="spinner"></div>
      <div class="state__text">Yüklənir…</div></div></div>

    <div class="card stack" id="questionCard" hidden>
      <div class="row row--between">
        <span class="badge badge--info" id="counter">Sual</span>
        <span class="text-sm text-muted" id="scoreLabel"></span>
      </div>
      <!-- Tərəqqi zolağı: «Sual 3/12» rəqəmdir, zolaq isə nə qədər
           qaldığını bir baxışda göstərir. -->
      <div class="progress"><div class="progress__fill" id="progressFill"></div></div>
      <h3 id="questionText"></h3>
      <div class="stack stack--tight" id="options"></div>
    </div>

    <div class="card stack" id="feedbackCard" hidden>
      <!-- Nişan `row`-un içindədir: `stack` sütununda tək element bütün
           eni tutur və rəngli zolağa çevrilir. -->
      <div class="row"><span class="badge" id="feedbackBadge"></span></div>
      <!-- Sual mətni geri bildirimdə TƏKRARLANIR: izah suala istinad
           edir, sual isə artıq ekrandan getmişdi. -->
      <p class="text-sm text-muted" id="feedbackQuestion"></p>
      <p id="chosenText" hidden></p>
      <p id="correctText"></p>
      <p class="text-sm text-muted" id="explanationText"></p>
      <button class="btn btn--primary btn--block" type="button" id="nextBtn">Növbəti sual</button>
    </div>

    <div class="card stack" id="doneCard" hidden style="text-align: center">
      <div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-check"></use></svg></div>
      <h3>Tapşırıq tamamlandı</h3>
      <p id="finalScore"></p>
      <a class="btn btn--secondary" href="tapsiriqlar.html">Tapşırıqlara qayıt</a>
    </div>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { mountShell, requireLogin } from './assets/js/page-shell.js';
  import { answerFeedback, scoreLine } from './assets/js/answer-feedback.js';

  const LETTERS = 'ABCDE';

  if (requireLogin()) {
    mountShell();

    const assignmentId = Number(new URLSearchParams(window.location.search).get('id'));
    const errorBox = document.getElementById('errorBox');
    const loading = document.getElementById('loading');
    const cards = {
      question: document.getElementById('questionCard'),
      feedback: document.getElementById('feedbackCard'),
      done: document.getElementById('doneCard'),
    };

    const show = (name) => {
      loading.hidden = true;
      for (const [key, card] of Object.entries(cards)) card.hidden = key !== name;
    };
    const showError = (text) => {
      loading.hidden = true;
      errorBox.textContent = text;
      errorBox.hidden = false;
    };

    let attemptId = null;
    let score = 0;
    let pendingQuestion = null;
    /* Geri bildirim kartı düzgün cavabın MƏTNİNİ göstərməlidir, amma
       server yalnız indeks qaytarır (`HomeworkAnswerResult`) - variant
       mətnləri yalnız burada, cari sualda var. */
    let currentQuestion = null;

    function renderQuestion(question) {
      currentQuestion = question;
      document.getElementById('counter').textContent =
        `Sual ${question.index + 1}/${question.total}`;
      const percent = question.total > 0
        ? Math.round((question.index / question.total) * 100) : 0;
      document.getElementById('progressFill').style.setProperty('--progress', `${percent}%`);
      document.getElementById('scoreLabel').textContent = `${score} düzgün`;
      document.getElementById('questionText').textContent = question.question;

      const options = document.getElementById('options');
      options.innerHTML = '';
      (question.options || []).forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'btn btn--secondary btn--block';
        button.type = 'button';
        button.style.justifyContent = 'flex-start';
        button.textContent = `${LETTERS[index] || index + 1}. ${option}`;
        button.addEventListener('click', () => submitAnswer(question.index, index, options));
        options.append(button);
      });
      show('question');
    }

    function renderFeedback(result, chosenIndex) {
      const feedback = answerFeedback({
        options: currentQuestion && currentQuestion.options,
        correctIndex: result.correct_index,
        chosenIndex,
        isCorrect: result.is_correct,
      });
      const badge = document.getElementById('feedbackBadge');
      badge.className = feedback.badge.className;
      badge.textContent = feedback.badge.label;
      document.getElementById('feedbackQuestion').textContent =
        currentQuestion ? currentQuestion.question : '';
      const chosen = document.getElementById('chosenText');
      chosen.textContent = feedback.chosenLine || '';
      chosen.hidden = !feedback.chosenLine;
      document.getElementById('correctText').textContent = feedback.correctLine;
      document.getElementById('explanationText').textContent = result.explanation || '';

      pendingQuestion = result.next_question;
      // `next_question === null` - bu, sonuncu sual idi (bax
      // `HomeworkAnswerResult`, models.py).
      document.getElementById('nextBtn').textContent =
        pendingQuestion ? 'Növbəti sual' : 'Nəticəni gör';
      show('feedback');
    }

    async function submitAnswer(questionIndex, chosenIndex, optionsContainer) {
      // İkiqat toxunuş serverdə "artıq cavablanıb" xətası verir və
      // istifadəçi səbəbini anlamır.
      for (const button of optionsContainer.children) button.disabled = true;
      try {
        const result = await request(`/homework/attempts/${attemptId}/answer`, {
          method: 'POST',
          body: { question_index: questionIndex, chosen_index: chosenIndex },
        });
        if (result.is_correct) score += 1;
        renderFeedback(result, chosenIndex);
      } catch (error) {
        showError(error.message);
        for (const button of optionsContainer.children) button.disabled = false;
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (pendingQuestion) {
        renderQuestion(pendingQuestion);
        pendingQuestion = null;
      } else {
        finishAttempt();
      }
    });

    /* Yekun nəticənin MƏXRƏCİ: `total` sonuncu sualdan gəlir, çünki
       cavab nəticəsi (`HomeworkAnswerResult`) onu daşımır. */
    function finishAttempt(total) {
      const questions = total ?? (currentQuestion && currentQuestion.total) ?? 0;
      document.getElementById('finalScore').textContent = scoreLine(score, questions);
      show('done');
    }

    if (!Number.isInteger(assignmentId) || assignmentId <= 0) {
      showError('Tapşırıq ünvanı düzgün deyil.');
    } else {
      request(`/homework/assignments/${assignmentId}/start`, { method: 'POST' })
        .then((state) => {
          attemptId = state.attempt_id;
          score = state.score || 0;
          if (!state.question) {
            // Cəhd artıq tamamlanıb - göstəriləcək sual yoxdur. Ümumi
            // sual sayı da yoxdur, ona görə faiz uydurulmur.
            finishAttempt(0);
            return;
          }
          renderQuestion(state.question);
        })
        .catch((error) => showError(error.message));
    }
  }
</script>
</body>
</html>
