<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesabatlar - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031f" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031f">
<link rel="stylesheet" href="assets/css/base.css?v=20261031f">
<link rel="stylesheet" href="assets/css/components.css?v=20261031f">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack">
    <!-- SİYAHI ƏVVƏL (2026-10-31): yeni tapşırıq forması siyahının
         üstündə idi. İndi başlıqdakı düymə ilə vərəqdə açılır. -->
    <div class="section-header">
      <h1>Ev tapşırıqları</h1>
      <span class="page-actions">
        <button class="btn btn--primary btn--sm" type="button" id="newAssignButton">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-plus"></use></svg>
          Yeni tapşırıq
        </button>
      </span>
    </div>
    <p class="text-sm text-muted">Çat seçin - həmin çatdakı tapşırıqlar və nəticələr.</p>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>
    <div class="notice notice--success" id="okBox" role="status" hidden></div>

    <div class="card stack">
      <div class="field">
        <label class="field__label" for="chatSelect">Çat</label>
        <select class="field__select" id="chatSelect"></select>
      </div>
    </div>
  </section>

  <section class="stack">
    <div class="section-header"><h2>Təyin edilmiş tapşırıqlar</h2></div>
    <div id="content"></div>
  </section>

</div>

<dialog class="sheet" id="assignSheet" aria-labelledby="assignSheetTitle">
  <div class="sheet__head">
    <h2 id="assignSheetTitle">Yeni tapşırıq</h2>
    <button class="btn btn--ghost btn--sm" type="button" data-sheet-close aria-label="Bağla">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-x"></use></svg>
    </button>
  </div>
  <div class="sheet__body stack">
    <p class="text-sm text-muted" id="assignChatNote"></p>
    <div class="notice notice--danger" id="assignError" role="alert" hidden></div>
    <form class="stack" id="assignForm">
      <div class="field">
        <label class="field__label" for="questionSetSelect">Sual bankı</label>
        <select class="field__select" id="questionSetSelect" required></select>
      </div>
      <div class="field">
        <label class="field__label" for="dueDate">Son tarix</label>
        <input class="field__input" id="dueDate" type="date" required>
      </div>
      <button class="btn btn--primary" type="submit" id="assignBtn">Təyin et</button>
    </form>
  </div>
</dialog>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { hasLevelStats, renderDifficultyStats } from './assets/js/difficulty.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { bindSheet, sheetKeyFromHash } from './assets/js/sheet.js';
  import { homeworkProgressBadge } from './assets/js/subjects.js';

  const STATUS_BADGE = {
    'tamamlanıb': 'badge badge--success',
    'davam edir': 'badge badge--warning',
    'gözləyir': 'badge badge--neutral',
  };

  if (requireLogin()) {
    mountShell();

    const errorBox = document.getElementById('errorBox');
    const okBox = document.getElementById('okBox');
    const chatSelect = document.getElementById('chatSelect');
    const questionSetSelect = document.getElementById('questionSetSelect');
    const content = document.getElementById('content');

    function flash(box, text) {
      box.textContent = text;
      box.hidden = false;
      setTimeout(() => { box.hidden = true; }, 4000);
    }

    function renderReportInto(container, assignment) {
      loadInto(
        container,
        () => request(`/homework/assignments/${assignment.id}/report`),
        (target, rows) => {
          target.innerHTML = '';
          if (!rows.length) {
            target.innerHTML = '<p class="text-sm text-muted">Bu çatda üzv yoxdur.</p>';
            return;
          }
          const list = document.createElement('div');
          list.className = 'stack stack--tight';
          for (const row of rows) {
            const line = document.createElement('div');
            line.className = 'row row--between';
            const name = document.createElement('span');
            name.className = 'text-sm';
            name.textContent = row.display_name;
            const status = document.createElement('span');
            status.className = STATUS_BADGE[row.status] || 'badge badge--neutral';
            status.textContent = row.score != null
              ? `${row.status} · ${row.score}` : row.status;
            line.append(name, status);
            list.append(line);
          }
          target.append(list);
          request(`/homework/assignments/${assignment.id}/difficulty`)
            .then((stats) => { if (hasLevelStats(stats)) target.append(renderDifficultyStats(stats)); })
            .catch(() => {});
        },
      );
    }

    function renderAssignments(container, assignments) {
      container.innerHTML = '';
      if (!assignments.length) {
        container.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-report"></use></svg></div>'
          + '<div class="state__title">Bu çatda tapşırıq yoxdur</div>'
          + '<div class="state__text">Yuxarıdan yeni tapşırıq təyin edin.</div></div>';
        return;
      }
      const list = document.createElement('div');
      list.className = 'stack';
      for (const assignment of [...assignments].sort((a, b) => b.id - a.id)) {
        const card = document.createElement('div');
        card.className = 'card stack stack--tight';
        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        /* «Tapşırıq #5» sistem nömrəsidir; müəllim onu tanımır. Sual
           bankının adı isə onun özünün yazdığı addır. */
        title.textContent = questionSetTitles.get(assignment.question_set_id)
          || `Tapşırıq #${assignment.id}`;
        const progressBadge = homeworkProgressBadge(
          assignment.completed_count, assignment.total_members,
        );
        const progress = document.createElement('span');
        progress.className = progressBadge.className;
        progress.textContent = progressBadge.label;
        head.append(title, progress);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-muted';
        meta.textContent = `Son tarix: ${assignment.due_date}`;

        const report = document.createElement('div');
        card.append(head, meta, report);
        renderReportInto(report, assignment);
        list.append(card);
      }
      container.append(list);
    }

    function reloadAssignments() {
      const chatId = Number(chatSelect.value);
      if (!Number.isInteger(chatId) || chatId <= 0) {
        content.innerHTML = '<p class="text-sm text-muted">Çat seçin.</p>';
        return;
      }
      loadInto(content, () => request(`/homework/assignments?chat_id=${chatId}`), renderAssignments);
    }

    /* Tapşırıq kartında sual bankının ADINI göstərmək üçün id→ad
       xəritəsi. Səhifə onsuz da `/live/question-sets`-i seçici üçün
       yükləyir, ona görə əlavə sorğu lazım deyil. */
    const questionSetTitles = new Map();

    Promise.all([request('/chats'), request('/live/question-sets')])
      .then(([chats, sets]) => {
        for (const set of sets) questionSetTitles.set(set.id, set.title);
        for (const chat of chats) {
          const option = document.createElement('option');
          option.value = String(chat.id);
          option.textContent = chat.name || `Çat #${chat.id}`;
          chatSelect.append(option);
        }
        // Yalnız HAZIR banklar təyin edilə bilər - backend yarımçıq
        // bankı 400 ilə rədd edir.
        for (const set of sets.filter((s) => s.status === 'ready')) {
          const option = document.createElement('option');
          option.value = String(set.id);
          option.textContent = set.title;
          questionSetSelect.append(option);
        }
        if (!chats.length) {
          content.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-message"></use></svg></div>'
            + '<div class="state__title">Çatınız yoxdur</div>'
            + '<div class="state__text">Tapşırıq təyin etmək üçün əvvəlcə qrup çatına üzv olun.</div></div>';
          return;
        }
        reloadAssignments();
        if (sheetKeyFromHash(location.hash, ['yeni'])) sheet.open();
      })
      .catch((error) => flash(errorBox, error.message));

    chatSelect.addEventListener('change', reloadAssignments);

    const assignError = document.getElementById('assignError');
    const sheet = bindSheet(document.getElementById('assignSheet'), {
      openers: [document.getElementById('newAssignButton')],
      onOpen: () => {
        assignError.hidden = true;
        // Tapşırıq seçilmiş çata gedir - vərəqdə hansı çat olduğu yazılır.
        const chosen = chatSelect.selectedOptions[0];
        document.getElementById('assignChatNote').textContent = chosen
          ? `Çat: ${chosen.textContent}` : 'Əvvəlcə çat seçin.';
      },
    });

    document.getElementById('assignForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('assignBtn');
      button.disabled = true;
      try {
        await request('/homework/assignments', {
          method: 'POST',
          body: {
            chat_id: Number(chatSelect.value),
            question_set_id: Number(questionSetSelect.value),
            due_date: document.getElementById('dueDate').value,
          },
        });
        sheet.close();
        flash(okBox, 'Tapşırıq təyin edildi.');
        reloadAssignments();
      } catch (error) {
        assignError.textContent = error.message;
        assignError.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  }
</script>
</body>
</html>
