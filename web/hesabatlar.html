<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesabatlar - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261103a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261103a">
<link rel="stylesheet" href="assets/css/base.css?v=20261103a">
<link rel="stylesheet" href="assets/css/components.css?v=20261103a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack">
    <!-- SİYAHI ƏVVƏL (2026-10-31): yeni tapşırıq forması siyahının
         üstündə idi. İndi başlıqdakı düymə ilə vərəqdə açılır. -->
    <div class="section-header">
      <h1>Ev tapşırıqları</h1>
      <span class="page-actions">
        <button class="btn btn--primary btn--sm" type="button" id="newAssignButton">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-plus"></use></svg>
          Yeni tapşırıq
        </button>
      </span>
    </div>
    <p class="text-sm text-muted">Çat seçin - həmin çatdakı tapşırıqlar və nəticələr.</p>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>
    <div class="notice notice--success" id="okBox" role="status" hidden></div>

    <div class="card stack">
      <div class="field">
        <label class="field__label" for="chatSelect">Çat</label>
        <select class="field__select" id="chatSelect"></select>
      </div>
    </div>
  </section>

  <!-- Faza 3 PR 1 (2026-11-03) - seçilmiş çatın inkişaf qrafikləri.
       Eyni çat seçicisi işlədilir - ayrıca sorğu/forma lazım deyil. -->
  <section class="stack" id="progressSection" hidden>
    <div class="section-header"><h2>İnkişaf qrafikləri</h2></div>
    <div class="card stack" id="progressCard"></div>
  </section>

  <!-- Faza 3 PR 3 (2026-11-03) - əl ilə ödəniş izləməsi. Onlayn kartla
       ödəniş bu fazada YOX (bax plan sənədi). -->
  <section class="stack" id="paymentsSection" hidden>
    <div class="section-header">
      <h2>Ödənişlər</h2>
      <div class="field">
        <label class="field__label sr-only" for="paymentsMonth">Ay</label>
        <input class="field__input" id="paymentsMonth" type="month">
      </div>
    </div>
    <div class="stack" id="paymentsCard"></div>
  </section>

  <section class="stack">
    <div class="section-header"><h2>Təyin edilmiş tapşırıqlar</h2></div>
    <div id="content"></div>
  </section>

</div>

<dialog class="sheet" id="assignSheet" aria-labelledby="assignSheetTitle">
  <div class="sheet__head">
    <h2 id="assignSheetTitle">Yeni tapşırıq</h2>
    <button class="btn btn--ghost btn--sm" type="button" data-sheet-close aria-label="Bağla">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-x"></use></svg>
    </button>
  </div>
  <div class="sheet__body stack">
    <p class="text-sm text-muted" id="assignChatNote"></p>
    <div class="notice notice--danger" id="assignError" role="alert" hidden></div>
    <form class="stack" id="assignForm">
      <div class="field">
        <label class="field__label" for="questionSetSelect">Sual bankı</label>
        <select class="field__select" id="questionSetSelect" required></select>
      </div>
      <div class="field">
        <label class="field__label" for="dueDate">Son tarix</label>
        <input class="field__input" id="dueDate" type="date" required>
      </div>
      <button class="btn btn--primary" type="submit" id="assignBtn">Təyin et</button>
    </form>
  </div>
</dialog>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { createEmptyState } from './assets/js/mascot.js';
  import { hasLevelStats, renderDifficultyStats } from './assets/js/difficulty.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { bindSheet, sheetKeyFromHash } from './assets/js/sheet.js';
  import { homeworkProgressBadge } from './assets/js/subjects.js';
  import {
    answerStatusLine, criterionLine, pointsError, suggestedPoints,
  } from './assets/js/open-questions.js';
  import { attendanceLine, hasProgressData, renderBySubject, renderWeekly } from './assets/js/progress-stats.js';

  const STATUS_BADGE = {
    'tamamlanıb': 'badge badge--success',
    'davam edir': 'badge badge--warning',
    'gözləyir': 'badge badge--neutral',
  };

  if (requireLogin()) {
    mountShell();

    const errorBox = document.getElementById('errorBox');
    const okBox = document.getElementById('okBox');
    const chatSelect = document.getElementById('chatSelect');
    const questionSetSelect = document.getElementById('questionSetSelect');
    const content = document.getElementById('content');

    function flash(box, text) {
      box.textContent = text;
      box.hidden = false;
      setTimeout(() => { box.hidden = true; }, 4000);
    }

    function renderReportInto(container, assignment) {
      loadInto(
        container,
        () => request(`/homework/assignments/${assignment.id}/report`),
        (target, rows) => {
          target.innerHTML = '';
          if (!rows.length) {
            target.innerHTML = '<p class="text-sm text-muted">Bu çatda üzv yoxdur.</p>';
            return;
          }
          const list = document.createElement('div');
          list.className = 'stack stack--tight';
          for (const row of rows) {
            const line = document.createElement('div');
            line.className = 'row row--between';
            const name = document.createElement('span');
            name.className = 'text-sm';
            name.textContent = row.display_name;
            const status = document.createElement('span');
            status.className = STATUS_BADGE[row.status] || 'badge badge--neutral';
            status.textContent = row.score != null
              ? `${row.status} · ${row.score}` : row.status;
            line.append(name, status);
            list.append(line);
          }
          target.append(list);
          request(`/homework/assignments/${assignment.id}/difficulty`)
            .then((stats) => { if (hasLevelStats(stats)) target.append(renderDifficultyStats(stats)); })
            .catch(() => {});
          request(`/homework/assignments/${assignment.id}/open-answers`)
            .then((answers) => { if (answers.length) target.append(renderOpenAnswers(answers)); })
            .catch(() => {});
          target.append(renderDiscussion(assignment.id));
        },
      );
    }

    /* Tapşırıq müzakirəsi (Faza 3 PR 2): sinif çatından AYRI mövzu. */
    function renderDiscussion(assignmentId) {
      const box = el('details', 'disclosure');
      box.append(el('summary', 'disclosure__summary', 'Müzakirə'));
      const body = el('div', 'disclosure__body stack');
      const list = el('div', 'stack stack--tight');
      const form = el('form', 'row');
      const input = el('input', 'field__input');
      input.placeholder = 'Cavab yazın…';
      input.maxLength = 2000;
      input.setAttribute('aria-label', 'Müzakirəyə mesaj');
      const send = el('button', 'btn btn--primary btn--sm', 'Göndər');
      send.type = 'submit';
      form.append(input, send);
      body.append(list, form);
      box.append(body);

      function load() {
        request(`/homework/assignments/${assignmentId}/discussion`)
          .then((messages) => {
            if (!messages.length) {
              list.replaceChildren(el('p', 'text-sm text-muted', 'Hələ mesaj yoxdur.'));
              return;
            }
            list.replaceChildren(...messages.map((m) => {
              const row = el('div', 'card stack stack--tight');
              row.append(el('strong', 'text-sm', m.display_name), el('p', 'text-sm', m.content));
              return row;
            }));
          })
          .catch(() => {});
      }

      box.addEventListener('toggle', () => { if (box.open) load(); }, { once: true });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const content = input.value.trim();
        if (!content) return;
        send.disabled = true;
        try {
          await request(`/homework/assignments/${assignmentId}/discussion`, {
            method: 'POST', body: { content },
          });
          input.value = '';
          load();
        } catch (error) {
          flash(errorBox, error.message);
        } finally {
          send.disabled = false;
        }
      });

      return box;
    }

    /* Yazılı cavablar (Faza 1, PR 2): AI balı TƏKLİFDİR, müəllim təsdiqləyir. */
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderOpenAnswers(answers) {
      const pending = answers.filter((a) => a.status !== 'confirmed').length;
      const box = el('details', 'disclosure');
      box.open = pending > 0;
      box.append(el('summary', 'disclosure__summary',
        `Yazılı cavablar · ${answers.length}${pending ? ` · ${pending} təsdiq gözləyir` : ''}`));
      const body = el('div', 'disclosure__body stack');
      for (const answer of answers) body.append(renderOpenAnswer(answer));
      box.append(body);
      return box;
    }

    function renderOpenAnswer(answer) {
      const card = el('div', 'card stack stack--tight');
      const head = el('div', 'row row--between');
      head.append(el('strong', '', answer.display_name),
        el('span', answer.status === 'confirmed' ? 'badge badge--success' : 'badge badge--neutral',
          answerStatusLine(answer, 'teacher')));
      card.append(head, el('p', 'text-sm text-muted', answer.question), el('p', '', answer.answer));
      if (answer.flagged === 'injection') {
        card.append(el('p', 'notice notice--danger', 'Cavabda AI-a ünvanlanmış təlimat var - AI bal vermədi.'));
      }
      if (answer.criteria.length) {
        const list = el('ul', 'text-sm');
        for (const grade of answer.criteria) list.append(el('li', '', criterionLine(grade)));
        card.append(list);
      }
      if (answer.feedback) card.append(el('p', 'text-sm', `AI rəyi: ${answer.feedback}`));
      if (answer.status === 'grading') return card;

      const form = el('form', 'row');
      const points = el('input', 'field__input field__input--points');
      points.type = 'number';
      points.min = '0';
      points.max = String(answer.max_points);
      points.value = suggestedPoints(answer);
      points.setAttribute('aria-label', `Bal (0-${answer.max_points})`);
      const comment = el('input', 'field__input');
      comment.placeholder = 'Şərh (istəyə görə)';
      comment.value = answer.teacher_comment || '';
      comment.setAttribute('aria-label', 'Şərh');
      const save = el('button', 'btn btn--primary btn--sm', answer.status === 'confirmed' ? 'Yenilə' : 'Təsdiqlə');
      save.type = 'submit';
      const pointsBox = el('label', 'row');
      pointsBox.append(points, el('span', 'text-sm text-muted', `/ ${answer.max_points} bal`));
      form.append(pointsBox, comment, save);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const problem = pointsError(points.value, answer.max_points);
        if (problem) { flash(errorBox, problem); return; }
        save.disabled = true;
        try {
          const updated = await request(`/homework/open-answers/${answer.id}/confirm`, {
            method: 'POST', body: { points: Number(points.value), comment: comment.value },
          });
          card.replaceWith(renderOpenAnswer(updated));
          flash(okBox, 'Bal təsdiqləndi.');
        } catch (error) {
          flash(errorBox, error.message);
          save.disabled = false;
        }
      });
      card.append(form);
      return card;
    }

    function renderAssignments(container, assignments) {
      container.innerHTML = '';
      if (!assignments.length) {
        container.replaceChildren(createEmptyState({
          title: 'Bu çatda tapşırıq yoxdur',
          text: 'Yuxarıdan yeni tapşırıq təyin edin.',
        }));
        return;
      }
      const list = document.createElement('div');
      list.className = 'stack';
      for (const assignment of [...assignments].sort((a, b) => b.id - a.id)) {
        const card = document.createElement('div');
        card.className = 'card stack stack--tight';
        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        /* «Tapşırıq #5» sistem nömrəsidir; müəllim onu tanımır. Sual
           bankının adı isə onun özünün yazdığı addır. */
        title.textContent = questionSetTitles.get(assignment.question_set_id)
          || `Tapşırıq #${assignment.id}`;
        const progressBadge = homeworkProgressBadge(
          assignment.completed_count, assignment.total_members,
        );
        const progress = document.createElement('span');
        progress.className = progressBadge.className;
        progress.textContent = progressBadge.label;
        head.append(title, progress);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-muted';
        meta.textContent = `Son tarix: ${assignment.due_date}`;

        const report = document.createElement('div');
        card.append(head, meta, report);
        renderReportInto(report, assignment);
        list.append(card);
      }
      container.append(list);
    }

    function reloadAssignments() {
      const chatId = Number(chatSelect.value);
      if (!Number.isInteger(chatId) || chatId <= 0) {
        content.innerHTML = '<p class="text-sm text-muted">Çat seçin.</p>';
        return;
      }
      loadInto(content, () => request(`/homework/assignments?chat_id=${chatId}`), renderAssignments);
      reloadProgress(chatId);
      reloadPayments(chatId);
    }

    const progressSection = document.getElementById('progressSection');
    function reloadProgress(chatId) {
      loadInto(document.getElementById('progressCard'), () => request(`/live/chats/${chatId}/progress`),
        (container, data) => {
          progressSection.hidden = !hasProgressData(data);
          if (!hasProgressData(data)) return;
          container.innerHTML = '';
          if (data.weekly.length) {
            const title = document.createElement('p');
            title.className = 'text-sm text-muted';
            title.textContent = 'Həftəlik düzgün faiz';
            container.append(title, renderWeekly(data.weekly));
          }
          if (data.by_subject.length) {
            const title = document.createElement('p');
            title.className = 'text-sm text-muted';
            title.textContent = 'Fənn üzrə müqayisə';
            container.append(title, renderBySubject(data.by_subject));
          }
          const attendance = document.createElement('p');
          attendance.className = 'text-sm text-muted';
          attendance.textContent = attendanceLine(data.attendance);
          container.append(attendance);
        });
    }

    /* Ödəniş izləməsi (Faza 3 PR 3): əl ilə, onlayn kartla ödəniş YOX. */
    const paymentsSection = document.getElementById('paymentsSection');
    const paymentsMonth = document.getElementById('paymentsMonth');
    const now = new Date();
    paymentsMonth.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    function renderPaymentRow(chatId, row) {
      const card = el('div', 'card stack stack--tight');
      const head = el('div', 'row row--between');
      head.append(el('strong', '', row.display_name),
        el('span', row.paid ? 'badge badge--success' : 'badge badge--neutral',
          row.paid ? `Ödənilib · ${row.paid_amount} AZN` : 'Ödənilməyib'));
      card.append(head);

      const feeForm = el('form', 'row');
      const feeInput = el('input', 'field__input field__input--points');
      feeInput.type = 'number';
      feeInput.min = '0';
      feeInput.placeholder = 'AZN';
      feeInput.value = row.monthly_amount ?? '';
      feeInput.setAttribute('aria-label', `${row.display_name} üçün aylıq məbləğ`);
      const feeSave = el('button', 'btn btn--secondary btn--sm', 'Məbləği təyin et');
      feeSave.type = 'submit';
      feeForm.append(feeInput, feeSave);
      feeForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (feeInput.value === '') return;
        feeSave.disabled = true;
        try {
          await request(`/live/chats/${chatId}/payments/fee`, {
            method: 'POST',
            body: { student_id: row.student_id, monthly_amount: Number(feeInput.value) },
          });
          reloadPayments(chatId);
        } catch (error) {
          flash(errorBox, error.message);
        } finally {
          feeSave.disabled = false;
        }
      });
      card.append(feeForm);

      const actions = el('div', 'row');
      if (row.paid) {
        const unmark = el('button', 'btn btn--ghost btn--sm', 'Ödənişi ləğv et');
        unmark.type = 'button';
        unmark.addEventListener('click', async () => {
          unmark.disabled = true;
          try {
            await request(`/live/chats/${chatId}/payments`
              + `?student_id=${row.student_id}&month=${paymentsMonth.value}`, { method: 'DELETE' });
            reloadPayments(chatId);
          } catch (error) {
            flash(errorBox, error.message);
            unmark.disabled = false;
          }
        });
        actions.append(unmark);
      } else {
        const mark = el('button', 'btn btn--primary btn--sm', 'Ödədi');
        mark.type = 'button';
        mark.disabled = row.monthly_amount == null;
        mark.addEventListener('click', async () => {
          mark.disabled = true;
          try {
            await request(`/live/chats/${chatId}/payments/mark`, {
              method: 'POST', body: { student_id: row.student_id, month: paymentsMonth.value },
            });
            reloadPayments(chatId);
          } catch (error) {
            flash(errorBox, error.message);
            mark.disabled = false;
          }
        });
        const remind = el('button', 'btn btn--secondary btn--sm', 'Xatırlat');
        remind.type = 'button';
        remind.disabled = row.monthly_amount == null;
        remind.addEventListener('click', async () => {
          remind.disabled = true;
          try {
            await request(`/live/chats/${chatId}/payments/${row.student_id}/remind`, {
              method: 'POST', body: { month: paymentsMonth.value },
            });
            flash(okBox, 'Xatırlatma çata göndərildi.');
          } catch (error) {
            flash(errorBox, error.message);
          } finally {
            remind.disabled = false;
          }
        });
        actions.append(mark, remind);
      }
      card.append(actions);
      return card;
    }

    function reloadPayments(chatId) {
      loadInto(document.getElementById('paymentsCard'),
        () => request(`/live/chats/${chatId}/payments?month=${paymentsMonth.value}`),
        (container, data) => {
          paymentsSection.hidden = !data.rows.length;
          if (!data.rows.length) return;
          container.replaceChildren(...data.rows.map((row) => renderPaymentRow(chatId, row)));
        });
    }

    paymentsMonth.addEventListener('change', () => reloadPayments(Number(chatSelect.value)));

    /* Tapşırıq kartında sual bankının ADINI göstərmək üçün id→ad
       xəritəsi. Səhifə onsuz da `/live/question-sets`-i seçici üçün
       yükləyir, ona görə əlavə sorğu lazım deyil. */
    const questionSetTitles = new Map();

    Promise.all([request('/chats'), request('/live/question-sets')])
      .then(([chats, sets]) => {
        for (const set of sets) questionSetTitles.set(set.id, set.title);
        for (const chat of chats) {
          const option = document.createElement('option');
          option.value = String(chat.id);
          option.textContent = chat.name || `Çat #${chat.id}`;
          chatSelect.append(option);
        }
        // Yalnız HAZIR banklar təyin edilə bilər - backend yarımçıq
        // bankı 400 ilə rədd edir.
        for (const set of sets.filter((s) => s.status === 'ready')) {
          const option = document.createElement('option');
          option.value = String(set.id);
          option.textContent = set.title;
          questionSetSelect.append(option);
        }
        if (!chats.length) {
          content.replaceChildren(createEmptyState({
            title: 'Çatınız yoxdur',
            text: 'Tapşırıq təyin etmək üçün əvvəlcə qrup çatına üzv olun.',
          }));
          return;
        }
        reloadAssignments();
        if (sheetKeyFromHash(location.hash, ['yeni'])) sheet.open();
      })
      .catch((error) => flash(errorBox, error.message));

    chatSelect.addEventListener('change', reloadAssignments);

    const assignError = document.getElementById('assignError');
    const sheet = bindSheet(document.getElementById('assignSheet'), {
      openers: [document.getElementById('newAssignButton')],
      onOpen: () => {
        assignError.hidden = true;
        // Tapşırıq seçilmiş çata gedir - vərəqdə hansı çat olduğu yazılır.
        const chosen = chatSelect.selectedOptions[0];
        document.getElementById('assignChatNote').textContent = chosen
          ? `Çat: ${chosen.textContent}` : 'Əvvəlcə çat seçin.';
      },
    });

    document.getElementById('assignForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('assignBtn');
      button.disabled = true;
      try {
        await request('/homework/assignments', {
          method: 'POST',
          body: {
            chat_id: Number(chatSelect.value),
            question_set_id: Number(questionSetSelect.value),
            due_date: document.getElementById('dueDate').value,
          },
        });
        sheet.close();
        flash(okBox, 'Tapşırıq təyin edildi.');
        reloadAssignments();
      } catch (error) {
        assignError.textContent = error.message;
        assignError.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  }
</script>
</body>
</html>
