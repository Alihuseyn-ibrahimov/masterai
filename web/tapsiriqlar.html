<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapşırıqlar - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031b" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031b">
<link rel="stylesheet" href="assets/css/base.css?v=20261031b">
<link rel="stylesheet" href="assets/css/components.css?v=20261031b">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Tapşırıqlarım</h1>
      <span class="section-header__hint">Öz sürətinizlə həll edin - vaxt limiti yoxdur</span>
    </div>
    <div id="content"></div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { subjectColorVar, subjectLabel } from './assets/js/subjects.js';
  import { deadlineNote, sortByUrgency } from './assets/js/deadline.js';

  const STATUS_BADGE = {
    'tamamlanıb': 'badge badge--success',
    'davam edir': 'badge badge--warning',
    'gözləyir': 'badge badge--neutral',
  };

  if (requireLogin()) {
    mountShell();

    function renderAssignments(container, assignments) {
      container.innerHTML = '';
      if (!assignments.length) {
        container.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-notes"></use></svg></div>'
          + '<div class="state__title">Tapşırıq yoxdur</div>'
          + '<div class="state__text">Müəlliminiz tapşırıq təyin edəndə burada görünəcək.</div></div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      /* Sıra TƏCİLİLİYƏ görədir (bax `deadline.js`): gecikmiş və yaxın
         olanlar əvvəldə, tamamlanmışlar sonda. Əvvəl yalnız «bitmiş
         sonda» qaydası vardı, yəni sabaha olan tapşırıq iki həftəlikdən
         sonra dura bilirdi. */
      for (const assignment of sortByUrgency(assignments)) {
        const card = document.createElement('div');
        card.className = 'card card--subject stack stack--tight';
        card.style.setProperty('--subject', subjectColorVar(assignment.subject));

        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        title.textContent = assignment.title;
        const status = document.createElement('span');
        status.className = STATUS_BADGE[assignment.status] || 'badge badge--neutral';
        status.textContent = assignment.status;
        head.append(title, status);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-muted';
        card.append(head, meta);

        /* Tapşırıq bitibsə son tarix artıq mənasızdır - «3 gün gecikib»
           yazmaq tamamlanmış işdə yanlış həyəcandır. */
        const note = assignment.status === 'tamamlanıb'
          ? null : deadlineNote(assignment.due_date);
        if (note) {
          const chip = document.createElement('span');
          chip.className = note.className;
          chip.textContent = note.label;
          // Dəqiq tarix ipucuda qalır: nişan «nə vaxta qədər»i deyir,
          // tarixin özü isə nadir hallarda lazım olur.
          chip.title = `Son tarix: ${assignment.due_date}`;
          // Status nişanının yanında, kartın ən görünən sətrində:
          // «gözləyir» sözündən çox «2 gün gecikib» hərəkətə çağırır.
          head.append(chip);
          meta.textContent = subjectLabel(assignment.subject);
        } else {
          meta.textContent = `${subjectLabel(assignment.subject)} · son tarix: ${assignment.due_date}`;
        }
        // Sual sayı başlamazdan ƏVVƏL lazımdır: «10 sual» ilə «30 sual»
        // arasında tələbənin indi başlayıb-başlamaması qərarı var.
        if (assignment.question_count && assignment.status !== 'tamamlanıb') {
          meta.textContent += ` · ${assignment.question_count} sual`;
        }

        if (assignment.status === 'tamamlanıb' && assignment.score != null) {
          const score = document.createElement('p');
          score.className = 'text-sm';
          // Məxrəc olmadan «8 düzgün» heç nə demir: 8/8-dir, yoxsa 8/30?
          score.textContent = assignment.question_count
            ? `Nəticə: ${assignment.score}/${assignment.question_count} düzgün`
            : `Nəticə: ${assignment.score} düzgün`;
          card.append(score);
        } else {
          const link = document.createElement('a');
          link.className = 'btn btn--primary btn--sm';
          link.href = `tapsiriq.html?id=${encodeURIComponent(assignment.assignment_id)}`;
          link.textContent = assignment.status === 'davam edir' ? 'Davam et' : 'Başla';
          card.append(link);
        }
        grid.append(card);
      }
      container.append(grid);
    }

    loadInto(
      document.getElementById('content'),
      () => request('/homework/my-assignments'),
      renderAssignments,
    );
  }
</script>
</body>
</html>
