<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapşırıqlar - MasterAI</title>
<meta name="theme-color" content="#2F6FED">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Tapşırıqlarım</h1>
      <span class="section-header__hint">Öz sürətinizlə həll edin - vaxt limiti yoxdur</span>
    </div>
    <div id="content"></div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { subjectColorVar, subjectLabel } from './assets/js/subjects.js';

  const STATUS_BADGE = {
    'tamamlanıb': 'badge badge--success',
    'davam edir': 'badge badge--warning',
    'gözləyir': 'badge badge--neutral',
  };

  if (requireLogin()) {
    mountShell();

    function renderAssignments(container, assignments) {
      container.innerHTML = '';
      if (!assignments.length) {
        container.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-notes"></use></svg></div>'
          + '<div class="state__title">Tapşırıq yoxdur</div>'
          + '<div class="state__text">Müəlliminiz tapşırıq təyin edəndə burada görünəcək.</div></div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      // Bitməmişlər əvvəldə - tələbənin işi olanlar yuxarıda olmalıdır.
      const ordered = [...assignments].sort((a, b) => {
        const done = (x) => (x.status === 'tamamlanıb' ? 1 : 0);
        return done(a) - done(b);
      });
      for (const assignment of ordered) {
        const card = document.createElement('div');
        card.className = 'card card--subject stack stack--tight';
        card.style.setProperty('--subject', subjectColorVar(assignment.subject));

        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        title.textContent = assignment.title;
        const status = document.createElement('span');
        status.className = STATUS_BADGE[assignment.status] || 'badge badge--neutral';
        status.textContent = assignment.status;
        head.append(title, status);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-muted';
        meta.textContent = `${subjectLabel(assignment.subject)} · son tarix: ${assignment.due_date}`;
        card.append(head, meta);

        if (assignment.status === 'tamamlanıb' && assignment.score != null) {
          const score = document.createElement('p');
          score.className = 'text-sm';
          score.textContent = `Nəticə: ${assignment.score} düzgün`;
          card.append(score);
        } else {
          const link = document.createElement('a');
          link.className = 'btn btn--primary btn--sm';
          link.href = `tapsiriq.html?id=${encodeURIComponent(assignment.assignment_id)}`;
          link.textContent = assignment.status === 'davam edir' ? 'Davam et' : 'Başla';
          card.append(link);
        }
        grid.append(card);
      }
      container.append(grid);
    }

    loadInto(
      document.getElementById('content'),
      () => request('/homework/my-assignments'),
      renderAssignments,
    );
  }
</script>
</body>
</html>
