<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çat - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css?v=20260912a">
<link rel="stylesheet" href="assets/css/base.css?v=20260912a">
<link rel="stylesheet" href="assets/css/components.css?v=20260912a">
<style>
  /* Mesaj axını uzun olur - daxili sürüşmə ilə yazma sahəsi həmişə
     görünən qalır. Yalnız bu səhifəyə aiddir, ona görə burada. */
  #messages {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    max-height: 60vh;
    overflow-y: auto;
    padding-right: var(--space-1);
  }
</style>
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack">
    <div class="section-header">
      <h1 id="chatTitle">Çat</h1>
      <!-- Geri linki başlıqdadır: bütün digər daxili səhifələrdə
           (`suallar`, `tapsiriq`, `nailiyyetler`) eyni yerdədir, burada
           isə səhifənin ən altında adi mətn linki kimi qalmışdı. -->
      <div class="row row--tight">
        <span class="badge badge--neutral" id="connStatus">Qoşulur…</span>
        <a class="btn btn--ghost btn--sm" href="chatlar.html">← Çatlar</a>
      </div>
    </div>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

    <!-- Canlı sessiya kartı. Mesaj axınının İÇİNDƏ deyil, üstündədir:
         axına düşsə yeni mesajlarla yuxarı sürüşüb itərdi, halbuki
         sessiya davam etdiyi müddətdə görünən qalmalıdır. -->
    <div class="card stack stack--tight" id="liveCard" hidden>
      <div class="row row--between">
        <div>
          <div class="text-xs text-muted">Canlı sessiya</div>
          <strong id="liveTitle"></strong>
        </div>
        <span class="badge badge--success" id="liveStatus">Gözləyir</span>
      </div>
      <p class="text-sm text-muted" id="liveBy"></p>
      <a class="btn btn--primary" id="liveJoin" href="#">Qoşul</a>
    </div>

    <!-- Yalnız müəllimə görünür. Sessiya çatın içindən başlayır -
         tələbələr PIN yazmır. -->
    <div class="row row--end" id="teacherTools" hidden>
      <a class="btn btn--secondary btn--sm" id="startSessionLink" href="#">Sessiya başlat</a>
    </div>

    <div id="messages" aria-live="polite"></div>

    <form class="row" id="sendForm">
      <label class="sr-only" for="messageInput">Mesaj</label>
      <input class="field__input" id="messageInput" name="content" autocomplete="off"
             placeholder="Mesaj yazın…" style="flex: 1">
      <button class="btn btn--primary" type="submit" id="sendBtn">Göndər</button>
    </form>
  </section>

  <!-- Sinif lövhəsi. Mesaj axınının ALTINDA: hər dəfə açılanda göz
       önündə olmasına ehtiyac yoxdur, amma səhifədən çıxmadan
       baxılmalıdır. Yığcam saxlanılır (açılıb-bağlanan). -->
  <section class="stack">
    <details id="boardBox">
      <summary class="section-header__hint" style="cursor: pointer">
        Sinif lövhəsi
      </summary>
      <div class="stack stack--tight" id="board" style="margin-top: var(--space-4)"></div>
    </details>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { getToken, getUser, request } from './assets/js/api.js';
  import { ChatSocket } from './assets/js/chat-socket.js';
  import { upsertItem } from './assets/js/chat-item.js';
  import { buildNameLookup, renderItems } from './assets/js/chat-view.js';
  import { mountShell, requireLogin } from './assets/js/page-shell.js';
  import { emptyLeaderboardText, leaderboardRows } from './assets/js/leaderboard.js';

  const STATUS_LABELS = {
    connecting: ['Qoşulur…', 'badge badge--neutral'],
    open: ['Bağlıdır', 'badge badge--success'],
    reconnecting: ['Yenidən qoşulur…', 'badge badge--warning'],
    closed: ['Bağlantı yoxdur', 'badge badge--danger'],
  };

  if (requireLogin()) {
    mountShell();

    const chatId = Number(new URLSearchParams(window.location.search).get('id'));
    const errorBox = document.getElementById('errorBox');
    const messages = document.getElementById('messages');
    const statusBadge = document.getElementById('connStatus');

    function showError(text) {
      errorBox.textContent = text;
      errorBox.hidden = false;
    }

    if (!Number.isInteger(chatId) || chatId <= 0) {
      showError('Çat ünvanı düzgün deyil. Çatlar siyahısından seçin.');
      statusBadge.hidden = true;
    } else {
      const user = getUser() || {};
      let items = [];
      let context = { lookup: new Map(), userId: user.id, onAnswer: () => {} };

      function repaint() {
        const atBottom = messages.scrollTop + messages.clientHeight >= messages.scrollHeight - 40;
        renderItems(messages, items, context);
        // Yeni mesaj gələndə aşağı sürüşdür - AMMA istifadəçi yuxarı
        // baxırsa yerini oğurlamaq olmaz.
        if (atBottom) messages.scrollTop = messages.scrollHeight;
      }

      // Üzv adları ayrıca gəlir; alınmasa çat YENƏ DƏ işləməlidir
      // (adlar "İstifadəçi #N" kimi görünər).
      request(`/chats/${chatId}/members`)
        .then((members) => {
          context = { ...context, lookup: buildNameLookup(members) };
          repaint();
        })
        .catch(() => {});

      request('/chats')
        .then((chats) => {
          const chat = (chats || []).find((c) => c.id === chatId);
          if (chat) document.getElementById('chatTitle').textContent = chat.name || 'Çat';
        })
        .catch(() => {});

      /* ---- Canlı sessiya ---- */

      const liveCard = document.getElementById('liveCard');

      if (user.is_teacher) {
        document.getElementById('teacherTools').hidden = false;
        document.getElementById('startSessionLink').href =
          `sessiyalar.html?chatId=${encodeURIComponent(chatId)}`;
      }

      /** Kartı göstərir. `session` `null` olsa kart gizlənir - sessiya
       *  bitəndə köhnə kart qalmamalıdır. */
      function renderLiveSession(session) {
        if (!session) {
          liveCard.hidden = true;
          return;
        }
        // Qəsdən textContent - bankın adını və müəllimin adını
        // istifadəçi yazır.
        document.getElementById('liveTitle').textContent = session.title || 'Canlı sessiya';
        document.getElementById('liveBy').textContent = session.started_by
          ? `${session.started_by} başlatdı`
          : '';
        const running = session.status === 'active';
        const statusEl = document.getElementById('liveStatus');
        statusEl.textContent = running ? 'Davam edir' : 'Gözləyir';
        statusEl.className = running ? 'badge badge--info' : 'badge badge--success';

        const join = document.getElementById('liveJoin');
        // Sessiyanı başladan müəllim KONSOLA gedir, qalanlar oynamağa.
        // ID ilə - adla müqayisə eyni adlı iki müəllimdə səhv işləyərdi.
        const isHost = session.started_by_user_id === user.id;
        join.href = isHost
          ? `sessiyalar.html?sessionId=${encodeURIComponent(session.session_id)}`
            + `&chatId=${encodeURIComponent(chatId)}`
          : `sessiya.html?id=${encodeURIComponent(session.session_id)}`;
        join.textContent = isHost ? 'Konsolu aç' : 'Qoşul';
        liveCard.hidden = false;
      }

      /* Yayım yalnız O AN bağlı olanlara çatır - sonradan çatı açan
         tələbə sessiyanı yalnız bu sorğu ilə görür. */
      request(`/chats/${chatId}/live-session`)
        .then(renderLiveSession)
        .catch(() => {});

      /* ---- Sinif lövhəsi ---- */

      const board = document.getElementById('board');

      function renderBoard(rows) {
        board.innerHTML = '';
        const empty = emptyLeaderboardText(rows);
        if (empty) {
          const note = document.createElement('p');
          note.className = 'text-sm text-muted';
          note.textContent = empty;
          board.append(note);
          return;
        }
        for (const row of leaderboardRows(rows, user.id)) {
          const line = document.createElement('div');
          line.className = row.isMe ? 'board-row board-row--me' : 'board-row';

          const left = document.createElement('div');
          const name = document.createElement('strong');
          name.className = 'text-sm';
          // Qəsdən textContent - adı istifadəçi özü yazır.
          name.textContent = `${row.rank}. ${row.name}`;
          const breakdown = document.createElement('div');
          breakdown.className = 'text-xs text-muted';
          breakdown.textContent = row.breakdown;
          left.append(name, breakdown);

          const total = document.createElement('span');
          total.className = 'badge badge--info';
          total.textContent = `${row.total} xal`;

          line.append(left, total);
          board.append(line);
        }
      }

      // Lövhə YALNIZ açılanda yüklənir: çat səhifəsi onsuz da üç sorğu
      // göndərir, dördüncüsü hər açılışda lazım deyil.
      const boardBox = document.getElementById('boardBox');
      let boardLoaded = false;
      boardBox.addEventListener('toggle', () => {
        if (!boardBox.open || boardLoaded) return;
        boardLoaded = true;
        board.innerHTML = '<p class="text-sm text-muted">Yüklənir…</p>';
        request(`/chats/${chatId}/leaderboard`)
          .then(renderBoard)
          .catch((error) => {
            boardLoaded = false;  // növbəti açılışda yenidən cəhd
            board.innerHTML = '';
            const note = document.createElement('p');
            note.className = 'text-sm text-muted';
            note.textContent = error.message;
            board.append(note);
          });
      });

      const socket = new ChatSocket({
        chatId,
        token: getToken(),
        onHistory: (history) => { items = history; repaint(); },
        onItem: (item) => { items = upsertItem(items, item); repaint(); },
        onLiveSession: renderLiveSession,
        onServerError: showError,
        onStatus: (status) => {
          const [label, className] = STATUS_LABELS[status] || STATUS_LABELS.closed;
          statusBadge.textContent = label;
          statusBadge.className = className;
          if (status === 'closed') {
            showError('Bağlantı bağlandı. Səhifəni yeniləyin və ya çatlara qayıdın.');
          }
        },
      });

      context.onAnswer = (questionId, chosenIndex) => {
        if (!socket.sendAnswer(questionId, chosenIndex)) {
          showError('Bağlantı hazır deyil - cavab göndərilmədi, bir azdan cəhd edin.');
        }
      };

      socket.connect();

      document.getElementById('sendForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;
        if (socket.sendText(content)) {
          input.value = '';
          errorBox.hidden = true;
        } else {
          showError('Bağlantı hazır deyil - mesaj göndərilmədi.');
        }
      });

      window.addEventListener('beforeunload', () => socket.close());
    }
  }
</script>
</body>
</html>
