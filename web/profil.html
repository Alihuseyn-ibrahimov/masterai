<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20260912a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260912a">
<link rel="stylesheet" href="assets/css/base.css?v=20260912a">
<link rel="stylesheet" href="assets/css/components.css?v=20260912a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header"><h1>Profil</h1></div>
    <div class="card stack">
      <div class="row">
        <span class="avatar avatar--lg" id="avatar">?</span>
        <div class="stack stack--tight">
          <h3 id="displayName">-</h3>
          <span class="text-sm text-muted" id="email">-</span>
          <div class="row" id="roles"></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-header"><h2>Görünüş</h2></div>
    <div class="card stack">
      <p class="text-sm text-muted">
        Defolt olaraq cihazınızın seçimi tətbiq olunur. Aşağıdan əl ilə dəyişə bilərsiniz.
      </p>
      <div class="row">
        <button class="btn btn--secondary btn--sm" data-theme-choice="light">İşıqlı</button>
        <button class="btn btn--secondary btn--sm" data-theme-choice="dark">Tünd</button>
        <button class="btn btn--ghost btn--sm" data-theme-choice="system">Cihaza uyğun</button>
      </div>
    </div>
  </section>

  <section id="studentExtras" hidden>
    <div class="section-header"><h2>Daha çox</h2></div>
    <div class="grid" style="--grid-min: 220px">
      <a class="card card--interactive stack stack--tight" href="nailiyyetler.html">
        <h4 class="row"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-trophy"></use></svg>Nailiyyətlər</h4>
        <p class="text-sm text-muted">Qazandığınız nişanlar</p>
      </a>
      <a class="card card--interactive stack stack--tight" href="tarixce.html">
        <h4 class="row"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chart-bar"></use></svg>Tarixçə</h4>
        <p class="text-sm text-muted">Keçmiş nəticələriniz</p>
      </a>
    </div>
  </section>

  <section>
    <div class="card stack">
      <h4>Hesabdan çıxış</h4>
      <p class="text-sm text-muted">Bu cihazda saxlanmış sessiya silinəcək.</p>
      <button class="btn btn--danger" type="button" id="logoutBtn">Çıxış et</button>
    </div>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { getUser } from './assets/js/api.js';
  import { logout, mountShell, requireLogin } from './assets/js/page-shell.js';
  /* Tema məntiqi PAYLAŞILAN moduldadır - əvvəl yalnız bu səhifənin
     içində idi və digər səhifələr seçimi oxumurdu. */
  import { readStoredTheme, setTheme } from './assets/js/theme.js';



  if (requireLogin()) {
    mountShell();

    const user = getUser() || {};
    const name = user.display_name || 'İstifadəçi';
    document.getElementById('displayName').textContent = name;
    document.getElementById('email').textContent = user.email || '';
    document.getElementById('avatar').textContent = name.trim().charAt(0).toUpperCase() || '?';

    const roles = document.getElementById('roles');
    if (user.is_teacher) {
      const badge = document.createElement('span');
      badge.className = 'badge badge--info';
      badge.textContent = 'Müəllim';
      roles.append(badge);
    }
    if (user.is_admin) {
      const badge = document.createElement('span');
      badge.className = 'badge badge--warning';
      badge.textContent = 'Admin';
      roles.append(badge);
    }
    if (!user.is_teacher) {
      document.getElementById('studentExtras').hidden = false;
    }

    /* Hansı seçimin aktiv olduğu ƏVVƏL heç yerdə görünmürdü -
       istifadəçi öz seçimini yalnız ekranın rəngindən təxmin edirdi. */
    const themeButtons = [...document.querySelectorAll('[data-theme-choice]')];
    function markActive(choice) {
      for (const button of themeButtons) {
        const isActive = button.dataset.themeChoice === choice;
        button.setAttribute('aria-pressed', String(isActive));
        button.classList.toggle('btn--primary', isActive);
        button.classList.toggle('btn--secondary', !isActive && button.dataset.themeChoice !== 'system');
        button.classList.toggle('btn--ghost', !isActive && button.dataset.themeChoice === 'system');
      }
    }
    markActive(readStoredTheme());
    for (const button of themeButtons) {
      button.addEventListener('click', () => markActive(setTheme(button.dataset.themeChoice)));
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  }
</script>
</body>
</html>
