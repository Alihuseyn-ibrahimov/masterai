<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qeydiyyat - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031b" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031b">
<link rel="stylesheet" href="assets/css/base.css?v=20261031b">
<link rel="stylesheet" href="assets/css/components.css?v=20261031b">
</head>
<body>
<main class="page-centered">
  <div class="stack stack--loose form-shell">

    <div class="stack stack--tight stack--center" style="text-align: center">
      <span class="brand">Master<span class="brand__accent">AI</span></span>
      <p class="text-muted text-sm">İmtahana hazırlıq - dərsdən test, dostlarla birgə</p>
    </div>

    <div class="card stack">
      <h1 style="font-size: var(--text-xl)">Qeydiyyat</h1>

      <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

      <form class="stack" id="registerForm" novalidate>
        <!-- Qeydiyyat QAPALIDIR: tələbə kursun kodunu müəllimdən alır.
             Müəllim isə sahibin dəvət linki ilə gəlir (?invite=...) -
             onda bu sahə gizlənir, çünki backend ikisini birlikdə qəbul
             etmir. -->
        <div class="field" id="courseCodeField">
          <label class="field__label" for="courseCode">Kurs kodu</label>
          <input class="field__input" id="courseCode" name="courseCode" type="text"
                 autocomplete="off" autocapitalize="characters" required maxlength="16"
                 placeholder="K7M-3QX">
          <span class="text-xs text-muted">Kodu müəlliminizdən alın</span>
        </div>
        <div class="notice notice--info" id="inviteNote" hidden>
          <span>Müəllim dəvəti ilə qeydiyyatdan keçirsiniz.</span>
        </div>
        <div class="field">
          <label class="field__label" for="displayName">Ad, soyad</label>
          <input class="field__input" id="displayName" name="displayName" type="text"
                 autocomplete="name" required maxlength="100" placeholder="Əli Məmmədov">
        </div>
        <div class="field">
          <label class="field__label" for="email">E-poçt</label>
          <input class="field__input" id="email" name="email" type="email"
                 autocomplete="email" required placeholder="ad@nümunə.az">
        </div>
        <div class="field">
          <label class="field__label" for="password">Şifrə</label>
          <input class="field__input" id="password" name="password" type="password"
                 autocomplete="new-password" required minlength="8">
          <!-- Backend `RegisterRequest.password` min 8 simvol tələb edir
               (server/models.py) - istifadəçi bunu ƏVVƏLCƏDƏN bilməlidir,
               422 xətasından sonra yox. -->
          <span class="text-xs text-muted">Ən azı 8 simvol</span>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="submitBtn">Hesab yarat</button>
      </form>
    </div>

    <p class="text-sm text-muted" style="text-align: center">
      Hesabınız var? <a href="giris.html">Daxil olun</a>
    </p>

  </div>
</main>

<script type="module">
  import { register } from './assets/js/api.js';
  import { redirectIfAlreadyLoggedIn, wireAuthForm } from './assets/js/auth-page.js';

  // Müəllim dəvət linki: qeydiyyat.html?invite=<token>
  const inviteToken = new URLSearchParams(window.location.search).get('invite') || '';
  if (inviteToken) {
    const codeField = document.getElementById('courseCodeField');
    codeField.hidden = true;
    // Gizli sahə `required` qalsa brauzer formanı göndərmir.
    document.getElementById('courseCode').required = false;
    document.getElementById('inviteNote').hidden = false;
  }

  if (!redirectIfAlreadyLoggedIn()) {
    wireAuthForm({
      form: document.getElementById('registerForm'),
      errorBox: document.getElementById('errorBox'),
      submitButton: document.getElementById('submitBtn'),
      submit: (data) => register(data.email, data.password, data.displayName, {
        courseCode: data.courseCode,
        inviteToken,
      }),
    });
  }
</script>
</body>
</html>
