<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sual bankları - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031a">
<link rel="stylesheet" href="assets/css/base.css?v=20261031a">
<link rel="stylesheet" href="assets/css/components.css?v=20261031a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <!-- SIRA: yaratma ƏN YUXARIDADIR.
       Bunu istifadəçi düzəltdi: real pilotda müəllim yeni sual bankını
       TEZ-TEZ yaradır. Mən əksini güman etmişdim («adətən mövcud bankı
       işlədir») və formanı aşağı salmışdım; real istifadə naxışını
       bilən istifadəçidir, fərziyyə mənim idi.

       Açılış mexanizmi saxlanılır, amma DEFOLT AÇIQDIR: bir klik də
       tez-tez edilən işə əlavə maneədir. Bankları nəzərdən keçirərkən
       yığmaq istəyən müəllim onu bağlaya bilər. -->
  <section>
    <div class="section-header">
      <h1>Sual bankları</h1>
    </div>
    <details class="disclosure" id="createPanel" open>
      <summary class="disclosure__summary">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-upload"></use></svg>
        Yeni sual bankı yarat
      </summary>

      <div class="disclosure__body stack">
      <div class="notice notice--danger" id="createError" role="alert" hidden></div>
      <div class="notice notice--success" id="createOk" role="status" hidden></div>

      <form class="stack" id="createForm">
        <div class="grid" style="--grid-min: 220px">
          <div class="field">
            <label class="field__label" for="title">Başlıq</label>
            <input class="field__input" id="title" name="title" required maxlength="120"
                   placeholder="Dövlət qulluğu haqqında qanun">
          </div>
          <div class="field">
            <label class="field__label" for="subject">Fənn</label>
            <select class="field__select" id="subject" name="subject" required></select>
          </div>
          <!-- Yalnız ingilis dili kursunda görünür (/me/course profili).
               Reading: suallar mətnə əsaslanır, mətn tələbəyə göstərilir -
               ona görə yalnız ev tapşırığında işlədilir. -->
          <div class="field" id="bankKindField" hidden>
            <label class="field__label" for="bankKind">Sual növü</label>
            <select class="field__select" id="bankKind" name="bank_kind">
              <option value="practice">Lüğət və qrammatika</option>
              <option value="reading">Reading (yalnız ev tapşırığı)</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="questionCount">Neçə sual?</label>
            <!-- min/maks backend-in yoxlaması ilə eynidir
                 (`_MIN_QUESTION_COUNT`/`_MAX_QUESTION_COUNT`, app.py) - uyğunsuzluq testlə tutulur. -->
            <input class="field__input" id="questionCount" name="question_count" type="number"
                   min="3" max="30" value="10" required>
          </div>
          <div class="field">
            <label class="field__label" for="kind">Material növü</label>
            <select class="field__select" id="kind" name="kind" required>
              <option value="link">Sayt linki</option>
              <option value="pdf">PDF fayl</option>
              <option value="image">Şəkil</option>
            </select>
          </div>
        </div>

        <!-- Çətinlik bölgüsü (2026-10-30). Cəmi 100 olmalıdır - backend
             eyni yoxlamanı edir (`pipeline/difficulty.py::validate_mix`). -->
        <div class="stack stack--tight" id="difficultyField" role="group" aria-labelledby="difficultyLabel">
          <span class="field__label" id="difficultyLabel">Çətinlik bölgüsü (%)</span>
          <div class="grid" style="--grid-min: 90px">
            <div class="field">
              <label class="field__label" for="easyPercent">Asan</label>
              <input class="field__input" id="easyPercent" type="number" min="0" max="100" value="30" required>
            </div>
            <div class="field">
              <label class="field__label" for="mediumPercent">Orta</label>
              <input class="field__input" id="mediumPercent" type="number" min="0" max="100" value="50" required>
            </div>
            <div class="field">
              <label class="field__label" for="hardPercent">Çətin</label>
              <input class="field__input" id="hardPercent" type="number" min="0" max="100" value="20" required>
            </div>
          </div>
          <span class="text-xs text-muted" id="difficultyHint" aria-live="polite">Cəmi: 100%</span>
        </div>

        <label class="row row--tight">
          <input type="checkbox" id="makeSummary" checked>
          <span>Dərs xülasəsi də hazırla</span>
        </label>

        <div class="field" id="linkField">
          <label class="field__label" for="location">Sayt linki</label>
          <input class="field__input" id="location" name="location"
                 placeholder="e-qanun.az/framework/4481">
          <span class="text-xs text-muted">
            <code>https://</code> yazmasanız da olar - özü əlavə olunur.
          </span>
        </div>

        <div class="field" id="fileField" hidden>
          <label class="field__label" for="file">Fayl</label>
          <input class="field__input" id="file" name="file" type="file">
          <span class="text-xs text-muted">Ən çox 20 MB.</span>
        </div>

        <button class="btn btn--primary" type="submit" id="createBtn">Yarat</button>
        <p class="text-xs text-muted">
          Emal 1-3 dəqiqə çəkir. Siyahı hər 10 saniyədən bir özü yenilənir.
        </p>
      </form>
      </div>
    </details>
  </section>


  <section>
    <div class="section-header">
      <h2>Mövcud banklar</h2>
      <button class="btn btn--ghost btn--sm" type="button" id="refreshBtn">Yenilə</button>
    </div>
    <p class="banks-summary" id="summary" role="status"></p>
    <!-- İş xülasəsi: müəllimin dərhal görməli olduğu iki fakt. Üç böyük
         rəqəm kartı QƏSDƏN yoxdur; burada rəqəm yox, VƏZİYYƏT və ona
         aparan keçid göstərilir. Data yoxdursa panel ÜMUMİYYƏTLƏ
         göstərilmir (boş qutu məlumat vermir). -->
    <div class="brief" id="brief" hidden></div>
    <div id="content"></div>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { API_BASE_URL, MAX_UPLOAD_BYTES } from './assets/js/config.js';
  import { ApiError, extractErrorMessage, getToken, request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { createBankCard } from './assets/js/bank-card.js';
  import { SUBJECTS } from './assets/js/subjects.js';
  import { mixError } from './assets/js/difficulty.js';

  const POLL_INTERVAL_MS = 10000;

  if (requireLogin()) {
    mountShell();

    const subjectSelect = document.getElementById('subject');
    for (const subject of SUBJECTS) {
      const option = document.createElement('option');
      option.value = subject.key;
      option.textContent = subject.label;
      subjectSelect.append(option);
    }

    // İngilis dili kursu: sual növü seçimi görünür, fənn «Xarici dil» olur.
    request('/me/course').then((course) => {
      if (course.profile !== 'english') return;
      document.getElementById('bankKindField').hidden = false;
      subjectSelect.value = 'xarici_dil';
    }).catch(() => { /* seçim gizli qalır - adi bank yaradılır */ });

    const kindSelect = document.getElementById('kind');
    const linkField = document.getElementById('linkField');
    const fileField = document.getElementById('fileField');
    kindSelect.addEventListener('change', () => {
      const isLink = kindSelect.value === 'link';
      linkField.hidden = !isLink;
      fileField.hidden = isLink;
    });

    const content = document.getElementById('content');

    /* Uğursuz bankı yenidən yaratmaq: forma eyni başlıq/fənn/material
       ilə doldurulur və açılır. Fayl sahəsi doldurula BİLMƏZ (brauzer
       təhlükəsizlik qaydası), ona görə yalnız link materialında
       ünvan qoyulur. */
    function refillCreateForm(set) {
      createPanel.open = true;
      const title = document.getElementById('title');
      const subject = document.getElementById('subject');
      title.value = set.title;
      if (subject.querySelector(`option[value="${set.subject}"]`)) subject.value = set.subject;
      if (set.material_kind === 'link' && set.material_location) {
        document.getElementById('kind').value = 'link';
        document.getElementById('kind').dispatchEvent(new Event('change'));
        document.getElementById('location').value = set.material_location;
      }
      createPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      title.focus();
    }

    /* İş xülasəsi. `GET /live/teacher-summary` bu məlumatları bir
       sorğuda yığır; əvvəl müəllim eyni cavabı tapmaq üçün üç ayrı
       səhifəni gəzməli olurdu. Sorğu uğursuz olsa panel sadəcə
       GÖSTƏRİLMİR: bu, köməkçi məlumatdır, səhifəni bloklamamalıdır. */
    const brief = document.getElementById('brief');

    function briefItem(label, value, linkText, href) {
      const item = document.createElement('div');
      item.className = 'brief__item';
      const name = document.createElement('span');
      name.className = 'brief__label';
      name.textContent = label;
      const text = document.createElement('p');
      text.className = 'brief__value';
      text.textContent = value;
      item.append(name, text);
      if (href) {
        const link = document.createElement('a');
        link.className = 'brief__link';
        link.href = href;
        link.textContent = linkText;
        item.append(link);
      }
      return item;
    }

    async function loadBrief() {
      let data;
      try {
        data = await request('/live/teacher-summary');
      } catch (error) {
        brief.hidden = true;
        return;
      }
      brief.innerHTML = '';

      if (data.homework && data.homework.next_due) {
        const due = data.homework.next_due;
        brief.append(briefItem(
          'Ən yaxın son tarix',
          `${due.title}, ${due.due_date}. ${due.started} tələbə başlayıb.`,
          'Hesabatlara bax',
          'hesabatlar.html',
        ));
      }

      if (data.last_session) {
        const session = data.last_session;
        brief.append(briefItem(
          'Son sessiya',
          `${session.title}, ${session.participants} iştirakçı.`,
          'Sessiyalara bax',
          'sessiyalar.html',
        ));
      }

      brief.hidden = brief.childElementCount === 0;
    }

    const summary = document.getElementById('summary');
    const createPanel = document.getElementById('createPanel');

    /* Bir sətirlik vəziyyət. Üç böyük rəqəm kartı QƏSDƏN seçilmədi:
     * o naxış hər mövzuda eyni çıxır və dekorasiyadır. Burada rəqəmlər
     * dekorasiya deyil: «uğursuz» sayı müəllimin dərhal görməli olduğu
     * şeydir (real ölçmədə bankların 32%-i uğursuz olub). */
    function renderSummary(sets) {
      if (!sets.length) {
        summary.textContent = '';
        summary.hidden = true;
        return;
      }
      const count = (status) => sets.filter((set) => set.status === status).length;
      const parts = [`${count('ready')} hazır`];
      const processing = count('processing');
      const failed = count('failed');
      if (processing) parts.push(`${processing} hazırlanır`);
      if (failed) parts.push(`${failed} uğursuz`);
      summary.textContent = parts.join(', ');
      summary.hidden = false;
      summary.classList.toggle('banks-summary--attention', failed > 0);
    }

    function renderSets(container, sets) {
      container.innerHTML = '';
      renderSummary(sets);
      if (!sets.length) {
        const state = document.createElement('div');
        state.className = 'state';
        state.innerHTML = '<div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-books"></use></svg></div>'
          + '<div class="state__title">Hələ sual bankı yoxdur</div>';
        const hint = document.createElement('div');
        hint.className = 'state__text';
        hint.textContent = 'Material yükləyin, AI ondan suallar hazırlayacaq.';
        state.append(hint);
        container.append(state);
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid grid--banks';
      // Ən yenilər yuxarıda - müəllim adətən indicə yaratdığını axtarır.
      for (const set of [...sets].sort((a, b) => b.id - a.id)) {
        const actions = [];
        if (set.status === 'failed') {
          /* Uğursuz bank ölü qutu olaraq qalmamalıdır. Yeni endpoint
             LAZIM DEYİL: düymə yaratma formasını eyni məlumatla
             doldurur. Real ölçmədə bankların 32%-i uğursuz olub və
             səbəb çox vaxt keçicidir (serverdə Chrome-un yaddaş
             darlığı), yəni təkrar cəhd işləyir. */
          actions.push({ label: 'Yenidən cəhd et', onClick: () => refillCreateForm(set) });
        }
        if (set.status === 'ready') {
          actions.push({ label: 'Suallara bax', href: `suallar.html?id=${encodeURIComponent(set.id)}` });
          actions.push({ label: 'Xülasə', href: `xulase.html?bank=${encodeURIComponent(set.id)}` });
          actions.push({
            label: 'Sessiya başlat',
            primary: true,
            href: `sessiyalar.html?questionSetId=${encodeURIComponent(set.id)}`,
          });
        }

        /* «Hazırlanır» kartı əvvəl boş qutu idi. Müəllim nə qədər
           gözləyəcəyini bilmirsə «ilişib qalıb?» sualı yaranır. */
        const note = set.status === 'processing'
          ? 'AI sualları hazırlayır, adətən 1-3 dəqiqə. Siyahı özü yenilənir.'
          : null;

        grid.append(createBankCard(set, { actions, note }));
      }
      container.append(grid);
    }

    const reload = () => {
      loadBrief();
      return loadInto(content, () => request('/live/question-sets'), renderSets);
    };
    reload();
    document.getElementById('refreshBtn').addEventListener('click', reload);

    // Emal fonda gedir - siyahı özü yenilənməsə müəllim səhifəni əl ilə
    // təzələməli olur və "ilişib qalıb?" sualı yaranır.
    setInterval(() => {
      if (!document.hidden) reload();
    }, POLL_INTERVAL_MS);

    const form = document.getElementById('createForm');
    const createBtn = document.getElementById('createBtn');
    const createError = document.getElementById('createError');
    const createOk = document.getElementById('createOk');

    const percentInputs = ['easyPercent', 'mediumPercent', 'hardPercent']
      .map((id) => document.getElementById(id));
    const difficultyHint = document.getElementById('difficultyHint');
    function percentValues() { return percentInputs.map((input) => input.value); }
    function updateDifficultyHint() {
      const error = mixError(percentValues());
      const sum = percentValues().reduce((a, b) => a + (Number(b) || 0), 0);
      difficultyHint.textContent = error || `Cəmi: ${sum}%`;
    }
    for (const input of percentInputs) input.addEventListener('input', updateDifficultyHint);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      createError.hidden = true;
      createOk.hidden = true;

      const kind = kindSelect.value;
      const fileInput = document.getElementById('file');
      const file = fileInput.files && fileInput.files[0];

      if (kind !== 'link' && !file) {
        createError.textContent = 'Fayl seçilməyib.';
        createError.hidden = false;
        return;
      }
      if (file && file.size > MAX_UPLOAD_BYTES) {
        // Serverə 20 MB-dan böyük fayl göndərib 413 gözləməkdənsə
        // dərhal aydın mesaj.
        createError.textContent = 'Fayl 20 MB-dan böyükdür.';
        createError.hidden = false;
        return;
      }

      const difficultyError = mixError(percentValues());
      if (difficultyError) {
        createError.textContent = difficultyError;
        createError.hidden = false;
        return;
      }

      const body = new FormData();
      body.append('subject', subjectSelect.value);
      body.append('title', document.getElementById('title').value);
      body.append('kind', kind);
      body.append('question_count', document.getElementById('questionCount').value);
      body.append('bank_kind', document.getElementById('bankKind').value);
      body.append('easy_percent', percentInputs[0].value);
      body.append('medium_percent', percentInputs[1].value);
      body.append('hard_percent', percentInputs[2].value);
      if (document.getElementById('makeSummary').checked) body.append('make_summary', 'true');
      if (kind === 'link') body.append('location', document.getElementById('location').value);
      else body.append('file', file);

      createBtn.disabled = true;
      createBtn.textContent = 'Göndərilir…';
      try {
        // `multipart/form-data` üçün `api.js`-in JSON sarğısı uyğun
        // deyil - `Content-Type` başlığını brauzer özü (sərhəd
        // parametri ilə birlikdə) qoymalıdır.
        const response = await fetch(`${API_BASE_URL}/live/question-sets`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${getToken()}` },
          body,
        });
        let payload = null;
        try { payload = await response.json(); } catch { payload = null; }
        if (!response.ok) {
          throw new ApiError(extractErrorMessage(response.status, payload), response.status);
        }
        form.reset();
        kindSelect.dispatchEvent(new Event('change'));
        createOk.textContent = 'Material qəbul edildi. Emal bitəndə statusu "Hazırdır" olacaq.';
        createOk.hidden = false;
        reload();
      } catch (error) {
        createError.textContent = error.message || 'Xəta baş verdi.';
        createError.hidden = false;
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = 'Yarat';
      }
    });
  }
</script>
</body>
</html>
