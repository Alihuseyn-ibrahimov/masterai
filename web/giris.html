<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daxil ol - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<main class="page-centered">
  <div class="stack stack--loose form-shell">

    <div class="stack stack--tight stack--center" style="text-align: center">
      <span class="brand">Master<span class="brand__accent">AI</span></span>
      <p class="text-muted text-sm">İmtahana hazırlıq - dərsdən test, dostlarla birgə</p>
    </div>

    <div class="card stack">
      <h1 style="font-size: var(--text-xl)">Daxil ol</h1>

      <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

      <form class="stack" id="loginForm" novalidate>
        <div class="field">
          <label class="field__label" for="email">E-poçt</label>
          <input class="field__input" id="email" name="email" type="email"
                 autocomplete="email" required placeholder="ad@nümunə.az">
        </div>
        <div class="field">
          <label class="field__label" for="password">Şifrə</label>
          <input class="field__input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="submitBtn">Daxil ol</button>
      </form>
    </div>

    <p class="text-sm text-muted" style="text-align: center">
      Hesabınız yoxdur? <a href="qeydiyyat.html">Qeydiyyatdan keçin</a>
    </p>

  </div>
</main>

<script type="module">
  import { login } from './assets/js/api.js';
  import { redirectIfAlreadyLoggedIn, wireAuthForm } from './assets/js/auth-page.js';

  if (!redirectIfAlreadyLoggedIn()) {
    wireAuthForm({
      form: document.getElementById('loginForm'),
      errorBox: document.getElementById('errorBox'),
      submitButton: document.getElementById('submitBtn'),
      submit: (data) => login(data.email, data.password),
    });
  }
</script>
</body>
</html>
