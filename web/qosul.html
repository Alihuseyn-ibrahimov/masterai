<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN ilə qoşul - MasterAI</title>
<meta name="theme-color" content="#2F6FED">
<meta name="description" content="Müəlliminizin verdiyi PIN ilə canlı test sessiyasına qoşulun. Hesab lazım deyil - PIN və adınız kifayətdir.">
<link rel="canonical" href="https://masterai.prdostu.com/qosul.html">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<main class="page-centered">
  <div class="stack stack--loose form-shell">

    <div class="stack stack--tight stack--center" style="text-align: center">
      <span class="brand">Master<span class="brand__accent">AI</span></span>
      <p class="text-muted text-sm">Müəlliminizin verdiyi PIN ilə qoşulun - hesab lazım deyil</p>
    </div>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

    <!-- 1. Qoşulma -->
    <div class="card stack" id="joinCard">
      <form class="stack" id="joinForm" novalidate>
        <div class="field">
          <label class="field__label" for="pin">Sessiya PIN-i</label>
          <input class="field__input" id="pin" name="pin" inputmode="numeric"
                 autocomplete="off" required placeholder="123456">
        </div>
        <div class="field">
          <label class="field__label" for="displayName">Adınız</label>
          <input class="field__input" id="displayName" name="displayName"
                 autocomplete="name" required maxlength="60" placeholder="Əli">
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="joinBtn">Qoşul</button>
      </form>
    </div>

    <!-- 2. Gözləmə -->
    <div class="card stack" id="waitCard" hidden style="text-align: center">
      <div class="spinner" style="margin: 0 auto"></div>
      <h3>Qoşuldunuz</h3>
      <p class="text-sm text-muted">Müəllim sessiyanı başladanda suallar görünəcək.</p>
    </div>

    <!-- 3. Sual -->
    <div class="card stack" id="questionCard" hidden>
      <div class="row row--between">
        <span class="badge badge--info" id="questionCounter">Sual</span>
        <span class="badge badge--neutral" id="countdown">-</span>
      </div>
      <h3 id="questionText"></h3>
      <div class="stack stack--tight" id="options"></div>
    </div>

    <!-- 4. Nəticə -->
    <div class="card stack" id="resultCard" hidden>
      <!-- Nişan `row`-un içindədir: `stack` sütununda tək element bütün
           eni tutur və rəngli zolağa çevrilir. -->
      <div class="row"><span class="badge" id="resultBadge"></span></div>
      <!-- Sual mətni təkrarlanır: izah suala istinad edir, sual isə
           artıq ekrandan getmişdi. -->
      <p class="text-sm text-muted" id="resultQuestion"></p>
      <p id="chosenText" hidden></p>
      <p id="correctText"></p>
      <p class="text-sm text-muted" id="explanationText"></p>
      <button class="btn btn--primary btn--block" type="button" id="nextBtn">Növbəti sual</button>
    </div>

    <!-- 5. Şəxsi bitiş -->
    <div class="card stack" id="personalCard" hidden style="text-align: center">
      <div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-check"></use></svg></div>
      <h3>Siz bitirdiniz</h3>
      <p id="personalScore"></p>
      <p class="text-sm text-muted">Sessiya bitəndə ümumi nəticələr görünəcək.</p>
    </div>

    <!-- 6. Sessiya bitdi -->
    <div class="card stack" id="finishedCard" hidden>
      <h3>Sessiya bitdi</h3>
      <div id="leaderboard"></div>
    </div>

    <p class="text-sm text-muted" style="text-align: center">
      <a href="giris.html">Hesabınızla daxil olun</a> - nəticələriniz tarixçənizə yazılsın
    </p>

  </div>
</main>

<script type="module">
  /* PIN ilə anonim qoşulma - MÜVƏQQƏTİ. Faza 4-də bu səhifə tamamilə
     silinir (sessiya artıq qrup çatının içindən başlayır). Ekran
     məntiqi `live-play-screen.js`-dədir və `sessiya.html` ilə
     ORTAQDIR - kopyalansaydı, bir tərəfdəki düzəliş digərini keçərdi. */
  import { getToken } from './assets/js/api.js';
  import { LivePinPlaySocket } from './assets/js/live.js';
  import { PlayScreen } from './assets/js/live-play-screen.js';

  let socket = null;
  const screen = new PlayScreen({
    root: document,
    onNext: () => {
      if (!socket.next()) screen.showError('Bağlantı hazır deyil - bir azdan cəhd edin.');
    },
  });

  document.getElementById('joinForm').addEventListener('submit', (event) => {
    event.preventDefault();
    screen.clearError();

    const pin = document.getElementById('pin').value.trim();
    const displayName = document.getElementById('displayName').value.trim();
    if (!pin || !displayName) {
      screen.showError('PIN və ad yazılmalıdır.');
      return;
    }

    const joinBtn = document.getElementById('joinBtn');
    joinBtn.disabled = true;
    joinBtn.textContent = 'Qoşulur…';

    socket = new LivePinPlaySocket({
      pin,
      displayName,
      // Daxil olmuş istifadəçinin tokeni KÖNÜLLÜ göndərilir - nəticə
      // tarixçəyə yazılsın deyə. Hesabsız qoşulma da tam işləkdir.
      token: getToken() || '',
      onStatus: (status) => {
        if (status === 'closed') {
          joinBtn.disabled = false;
          joinBtn.textContent = 'Qoşul';
          screen.showError(
            document.getElementById('joinCard').hidden
              ? 'Bağlantı bağlandı.'
              : 'Qoşulmaq alınmadı - PIN-i yoxlayın və ya sessiya artıq başlayıb.',
          );
        }
      },
      onMessage: (data) => screen.handle(data),
    });
    screen.onAnswer = (index, chosen) => socket.answer(index, chosen);
    socket.connect();
  });

  window.addEventListener('beforeunload', () => { if (socket) socket.close(); });
</script>
</body>
</html>
