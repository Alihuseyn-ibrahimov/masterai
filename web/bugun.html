<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bu gün - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg?v=20261103a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL (bax `assets/js/theme.js`). -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261103a">
<link rel="stylesheet" href="assets/css/base.css?v=20261103a">
<link rel="stylesheet" href="assets/css/components.css?v=20261103a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">
  <section class="today-head">
    <div class="stack stack--tight">
      <span class="today-greeting" id="greeting">Salam</span>
      <h1><span class="marker marker--draw">Bu gün</span></h1>
    </div>
    <!-- Bayquş + bir cümlə (Faza 4). Cümlə mətndir, bayquş bəzəkdir. -->
    <div class="today-head__buddy">
      <p class="say" id="mascotSay" hidden></p>
      <span class="mascot today-head__mascot" id="todayMascot" data-mascot="idle"></span>
    </div>
  </section>

  <div id="hero"></div>
  <div id="content" class="stack stack--loose"></div>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { getUser, request } from './assets/js/api.js';
  import { formatCode } from './assets/js/invite-code.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { createIcon } from './assets/js/icon.js';
  import { downloadLessonIcs, formatLessonTime, groupLessons, startsInText } from './assets/js/lessons.js';
  import { deadlineNote, sortByUrgency, todayIso } from './assets/js/deadline.js';
  import { BADGES, describeBadge } from './assets/js/badges.js';
  import { subjectColorVar, subjectLabel } from './assets/js/subjects.js';
  import {
    WEEKLY_GOAL_XP, ageText, earnedCount, freshSummary, goalPercent, greeting, heroAction, heroLesson, teacherHeroAction,
    mascotLine, nextBadge, nextHomework, streakDays, xpSince,
  } from './assets/js/today.js';
  import { mountMascots, setMascotState } from './assets/js/mascot.js';

  function say(line) {
    const bubble = document.getElementById('mascotSay');
    bubble.textContent = line.text;
    bubble.hidden = !line.text;
    setMascotState(document.getElementById('todayMascot'), line.state);
  }

  /* Kiçik DOM köməkçisi. İstifadəçi/server mətni HƏMİŞƏ textContent
     ilə yazılır (innerHTML yox). */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function sectionTitle(text, linkText, href) {
    const head = el('div', 'section-header');
    head.append(el('h2', '', text));
    if (linkText) {
      const link = el('a', 'section-header__hint', linkText);
      link.href = href;
      head.append(link);
    }
    return head;
  }

  function chip(text, icon, modifier) {
    const node = el('span', `hero-lesson__chip${modifier ? ` hero-lesson__chip--${modifier}` : ''}`);
    if (icon === 'live') node.append(el('span', 'live-dot'));
    else if (icon) node.append(createIcon(icon));
    node.append(document.createTextNode(text));
    return node;
  }

  function renderHero(container, lessons, isTeacher) {
    container.innerHTML = '';
    const hero = heroLesson(groupLessons(lessons));
    const card = el('article', 'hero-lesson');
    if (!hero) {
      card.append(el('div', 'hero-lesson__title', 'Bu gün canlı dərs yoxdur'));
      card.append(el('p', 'hero-lesson__meta', isTeacher
        ? 'Növbəti dərsi planlaşdırın - tələbələr onu «Bu gün»də görəcək.'
        : 'Müəllim dərs planlaşdıranda burada görünəcək.'));
      const go = el('a', 'btn btn--primary btn--lg', isTeacher ? 'Dərs planla' : 'Bütün dərslər');
      go.href = isTeacher ? 'dersler.html#yeni' : 'dersler.html';
      card.append(go);
      container.append(card);
      return;
    }
    const { lesson } = hero;
    const chips = el('div', 'hero-lesson__chips');
    // Gələcək dərsdə «Növbəti dərs» yerinə geri sayım: tələbə nə vaxt
    // qayıtmalı olduğunu bilir. Dəqiqədə bir yenilənir.
    const countdown = hero.kind === 'live' ? null : chip(startsInText(lesson.starts_at) || 'Növbəti dərs', 'clock');
    chips.append(hero.kind === 'live' ? chip('Canlı', 'live', 'live') : countdown);
    if (countdown) {
      const label = countdown.lastChild;
      const timer = setInterval(() => {
        if (!countdown.isConnected) { clearInterval(timer); return; }
        label.textContent = startsInText(lesson.starts_at) || 'Növbəti dərs';
      }, 30000);
    }
    chips.append(chip(lesson.mode === 'online' ? 'Onlayn' : 'Sinifdə', lesson.mode === 'online' ? 'video' : 'school'));
    if (hero.kind === 'live' && lesson.mode === 'offline' && !isTeacher) {
      chips.append(chip(lesson.attended ? 'Davamiyyət qeyd olundu' : 'QR ilə davamiyyət', 'qrcode'));
    }
    card.append(chips);
    card.append(el('div', 'hero-lesson__title', lesson.title));
    const meta = [lesson.chat_name, formatLessonTime(lesson.starts_at), `${lesson.duration_min} dəq`].filter(Boolean).join(' · ');
    card.append(el('p', 'hero-lesson__meta', meta));
    if (hero.kind === 'live' && lesson.mode === 'offline' && !isTeacher && !lesson.attended) {
      card.append(el('p', 'hero-lesson__meta', 'Davamiyyət üçün lövhədəki QR kodu telefonla skan edin.'));
    }
    const action = isTeacher ? teacherHeroAction(hero) : heroAction(hero);
    const button = el('a', `btn ${action.primary ? 'btn--primary' : 'btn--secondary'} btn--lg btn--block`);
    button.href = action.href;
    if (action.href.startsWith('dars.html')) button.append(createIcon('bolt'));
    button.append(document.createTextNode(action.label));
    card.append(button);
    if (hero.kind !== 'live') {
      // Bildiriş xidməti yoxdur: telefonun təqvimi 15 dəqiqə əvvəl xatırladır.
      const remind = el('button', 'btn btn--ghost btn--block');
      remind.type = 'button';
      remind.append(createIcon('clock'), document.createTextNode('Təqvimə əlavə et'));
      remind.addEventListener('click', () => downloadLessonIcs(lesson, location.origin));
      card.append(remind);
    }
    container.append(card);
  }

  function tile(iconNode, value, label) {
    const card = el('div', 'card tile');
    const text = el('div', 'stack stack--tight');
    text.style.gap = '0';
    text.append(el('div', 'tile__value', value), el('div', 'tile__label', label));
    card.append(iconNode, text);
    return card;
  }

  function iconTile(name, modifier) {
    const wrap = el('span', `tile__icon tile__icon--${modifier}`);
    wrap.append(createIcon(name));
    return wrap;
  }

  /* Açılışdakı «Bir dərsdən dörd material» yelpiyinin tətbiqdəki
     qarşılığı: başlıq + əl ilə çəkilmiş ox + keçid kartları. Kart
     bütövlükdə linkdir. Ox QƏSDƏN çəkilmə animasiyasız: məzmun sorğudan
     sonra gəlir və yarımçıq çəkilmiş ox iki nöqtə kimi görünürdü. */
  function desk(title, cards) {
    const section = el('section', 'desk');
    const head = el('div', 'desk__head');
    head.append(el('h2', '', title));
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'scribble desk__arrow');
    svg.setAttribute('viewBox', '0 0 120 60');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('pathLength', '1');
    path.setAttribute('d', 'M6 10 C 40 4, 72 18, 98 46 M98 46 L 85 45 M98 46 L 97 33');
    svg.append(path);
    head.append(svg);
    const fan = el('div', 'fan');
    for (const card of cards) {
      const link = el('a', 'fan__card card stack stack--tight');
      link.href = card.href;
      const kind = el('span', 'desk__kind');
      kind.append(createIcon(card.icon), document.createTextNode(card.kind));
      link.append(kind, el('h3', '', card.title), el('p', 'text-sm text-muted', card.text));
      fan.append(link);
    }
    section.append(head, fan);
    return section;
  }

  function renderStudent(container, data) {
    const [history, assignments, badges, summaries] = data;
    const today = todayIso();
    container.innerHTML = '';

    const streak = streakDays(history, today);
    const weekXp = xpSince(history, today, 7);
    const pct = goalPercent(weekXp);
    const tiles = el('div', 'tiles tiles--notes');
    tiles.append(tile(iconTile('flame', 'flame'), `${streak} gün`, 'Seriya'));
    tiles.append(tile(iconTile('bolt', 'xp'), `+${xpSince(history, today, 1)}`, 'Bu gün XP'));
    const ring = el('span', 'goal-ring');
    ring.style.setProperty('--pct', String(pct));
    ring.append(el('span', 'goal-ring__inner', `${pct}%`));
    tiles.append(tile(ring, `${weekXp} / ${WEEKLY_GOAL_XP}`, 'Həftəlik hədəf (XP)'));
    container.append(tiles);
    container.append(el('p', 'text-xs text-faint', 'Hər düzgün cavab 10 XP. Seriya - ardıcıl məşq etdiyiniz günlər.'));

    const next = nextHomework(sortByUrgency(assignments || [], today));
    say(mascotLine({ todayXp: xpSince(history, today, 1), streak, next }));
    const homeworkSection = el('section');
    homeworkSection.append(sectionTitle('Növbəti tapşırıq', 'Hamısı', 'tapsiriqlar.html'));
    if (next) {
      const card = el('a', 'card card--interactive today-card');
      card.href = `tapsiriq.html?id=${encodeURIComponent(next.assignment_id)}`;
      const top = el('div', 'today-card__top');
      const subject = el('span', 'chip-subject', subjectLabel(next.subject));
      subject.style.setProperty('--subject', subjectColorVar(next.subject));
      top.append(subject);
      const note = deadlineNote(next.due_date, today);
      if (note) top.append(el('span', note.className, note.label));
      card.append(top, el('div', 'today-card__title', next.title));
      card.append(el('div', 'text-sm text-muted', `${next.question_count} sual · ${next.status}`));
      const go = el('span', 'btn btn--primary btn--block', next.status === 'davam edir' ? 'Davam et' : 'Başla');
      card.append(go);
      homeworkSection.append(card);
    } else {
      homeworkSection.append(el('div', 'card card--flat text-muted', 'Açıq tapşırıq yoxdur. Afərin!'));
    }
    container.append(homeworkSection);

    const fresh = freshSummary(summaries, today);
    if (fresh) {
      const summarySection = el('section');
      summarySection.append(sectionTitle('Yeni konspekt', 'Hamısı', 'xulaseler.html'));
      const card = el('a', 'card card--interactive today-card');
      card.href = `xulase.html?id=${encodeURIComponent(fresh.summary.id)}`;
      const top = el('div', 'today-card__top');
      const subject = el('span', 'chip-subject', subjectLabel(fresh.summary.subject));
      subject.style.setProperty('--subject', subjectColorVar(fresh.summary.subject));
      top.append(subject, el('span', 'text-xs text-muted', ageText(fresh.ageDays)));
      card.append(top, el('div', 'today-card__title', fresh.summary.title));
      const intro = fresh.summary.content && fresh.summary.content.intro;
      if (intro) card.append(el('p', 'summary-card__intro', intro));
      card.append(el('span', 'btn btn--secondary btn--block', 'Oxu'));
      summarySection.append(card);
      container.append(summarySection);
    }

    const open = (assignments || []).filter((row) => row.status !== 'tamamlanıb').length;
    container.append(desk('Dəftərim', [
      { icon: 'notes', kind: 'Konspekt', title: `${(summaries || []).length} konspekt`,
        text: 'Müəllimin dərsdən sonra dərc etdiyi qısa qeydlər.', href: 'xulaseler.html' },
      { icon: 'target', kind: 'Tapşırıq', title: `${open} açıq tapşırıq`,
        text: 'Öz sürətinlə həll et, vaxt limiti yoxdur.', href: 'tapsiriqlar.html' },
      { icon: 'message', kind: 'AI tutor', title: '«Bəs istisna nədir?»',
        text: 'Keçilmiş dərslərdən soruş, cavab mənbə ilə gəlir.', href: 'tutor.html' },
      { icon: 'chart-bar', kind: 'Tarixçə', title: `${(history || []).length} nəticə`,
        text: 'Canlı sessiya və ev tapşırığı nəticələrin bir yerdə.', href: 'tarixce.html' },
    ]));

    const described = BADGES.map((badge) => describeBadge(
      (badges || []).find((row) => row.badge_type === badge.key) || { badge_type: badge.key, earned: false },
    ));
    const target = nextBadge(described);
    const badgeSection = el('section');
    badgeSection.append(sectionTitle('Növbəti nişan', `${earnedCount(described)} / ${described.length}`, 'nailiyyetler.html'));
    if (target) {
      const card = el('a', 'card card--interactive today-card');
      card.href = 'nailiyyetler.html';
      const row = el('div', 'tile');
      row.append(iconTile(target.icon, 'xp'));
      const text = el('div');
      text.append(el('div', 'today-card__title', target.label), el('div', 'text-sm text-muted', target.criteria));
      row.append(text);
      card.append(row);
      badgeSection.append(card);
    } else {
      badgeSection.append(el('div', 'card card--flat', 'Bütün nişanlar qazanılıb!'));
    }
    container.append(badgeSection);
  }

  /* Tələbə qeydiyyat kodu. Əvvəl yalnız sahib panelində görünürdü, yəni
     müəllim yeni tələbəyə nə deyəcəyini bilmirdi. Link kodu özü yazır. */
  function renderJoinCode(container, course) {
    if (!course || !course.join_code) return;
    const section = el('section');
    section.append(sectionTitle('Yeni tələbə üçün kod'));
    const card = el('div', 'card stack');
    card.append(el('div', 'text-sm text-muted', `${course.name} kursuna qeydiyyat kodu`));
    const code = el('div', 'today-card__title', formatCode(course.join_code));
    code.style.letterSpacing = '0.15em';
    card.append(code);
    const link = `${window.location.origin}/qeydiyyat.html?code=${encodeURIComponent(course.join_code)}`;
    const row = el('div', 'quick-actions');
    for (const [label, text] of [['Kodu kopyala', formatCode(course.join_code)], ['Linki kopyala', link]]) {
      const button = el('button', 'btn btn--secondary btn--block', label);
      button.type = 'button';
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = 'Kopyalandı';
        } catch {
          button.textContent = 'Əl ilə kopyalayın';
        }
      });
      row.append(button);
    }
    card.append(row);
    card.append(el('div', 'text-xs text-muted',
      'Yalnız bir qrupa qəbul etmək istəyirsinizsə, Çatlar bölməsindəki həmin qrupun kodunu verin: tələbə onunla da qeydiyyatdan keçir və yalnız o qrupa qoşulur.'));
    section.append(card);
    container.append(section);
  }

  function renderTeacher(container, summary, course) {
    container.innerHTML = '';
    const sets = (summary && summary.question_sets) || {};
    const homework = (summary && summary.homework) || {};
    const tiles = el('div', 'tiles tiles--notes');
    tiles.append(tile(iconTile('books', 'xp'), String(sets.ready || 0), 'Hazır sual bankı'));
    tiles.append(tile(iconTile('notes', 'flame'), String(homework.active || 0), 'Aktiv tapşırıq'));
    tiles.append(tile(iconTile('refresh', 'xp'), String(sets.processing || 0), 'Hazırlanan bank'));
    container.append(tiles);

    if (homework.next_due) {
      const due = homework.next_due;
      const section = el('section');
      section.append(sectionTitle('Ən yaxın son tarix', 'Hesabatlar', 'hesabatlar.html'));
      const card = el('a', 'card card--interactive today-card');
      card.href = 'hesabatlar.html';
      card.append(el('div', 'today-card__title', due.title));
      card.append(el('div', 'text-sm text-muted', `Son tarix ${due.due_date} · ${due.started} tələbə başlayıb`));
      section.append(card);
      container.append(section);
    }

    container.append(desk('Sürətli hərəkətlər', [
      { icon: 'presentation', kind: 'Dərs', title: 'Dərs planla',
        text: 'Onlayn və ya sinifdə. Tələbələr çatda xəbər alır.', href: 'dersler.html#yeni' },
      { icon: 'target', kind: 'Quiz', title: 'Quiz yarat',
        text: 'Material yüklə, AI sualları hazırlasın.', href: 'muellim.html' },
      { icon: 'bolt', kind: 'Canlı', title: 'Canlı quiz',
        text: 'Proyektorda PIN, tələbələr telefondan qoşulur.', href: 'sessiyalar.html' },
      { icon: 'chart-bar', kind: 'Hesabat', title: 'Hesabatlar',
        text: 'Kim başlayıb, kim bitirib, hansı sual çətin olub.', href: 'hesabatlar.html' },
    ]));
    renderJoinCode(container, course);
  }

  if (requireLogin()) {
    mountShell();
    const user = getUser() || {};
    const isTeacher = Boolean(user.is_teacher);
    document.getElementById('greeting').textContent = greeting(user.display_name);
    mountMascots();
    if (isTeacher) say(mascotLine({ isTeacher }));

    loadInto(document.getElementById('hero'), () => request('/me/lessons'),
      (box, lessons) => renderHero(box, lessons, isTeacher));

    const content = document.getElementById('content');
    if (isTeacher) {
      // Kod bloku əlavədir: sorğu sınsa ekranın qalanı yenə açılır.
      loadInto(content, () => Promise.all([
        request('/live/teacher-summary'),
        request('/me/course').catch(() => null),
      ]), (box, [summary, course]) => renderTeacher(box, summary, course));
    } else {
      loadInto(content, () => Promise.all([
        request('/history/me'),
        request('/homework/my-assignments'),
        request('/badges/me'),
        // Konspekt bloku əlavədir: sorğu sınsa ekranın qalanı yenə açılır.
        request('/me/summaries').catch(() => []),
      ]), renderStudent);
    }
  }
</script>
</body>
</html>
