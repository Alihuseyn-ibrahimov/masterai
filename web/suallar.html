<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suallar - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031d" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031d">
<link rel="stylesheet" href="assets/css/base.css?v=20261031d">
<link rel="stylesheet" href="assets/css/components.css?v=20261031d">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section class="stack">
    <div class="section-header">
      <h1 id="setTitle">Suallar</h1>
      <a class="btn btn--ghost btn--sm" href="muellim.html">← Sual bankları</a>
    </div>
    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>
    <div class="notice notice--success" id="okBox" role="status" hidden></div>

    <!-- Keyfiyyət paneli. Data gəlməsə ÜMUMİYYƏTLƏ göstərilmir: audit
         köməkçi məlumatdır, sualların redaktəsini bloklamamalıdır. -->
    <div class="audit" id="audit" hidden></div>

    <!-- AI yoxlama komandası (gün 10): fakt yoxlayıcı + metodist + redaktor. -->
    <div class="audit" id="aiReview" hidden>
      <div class="row row--between">
        <strong>AI yoxlama komandası</strong>
        <button class="btn btn--secondary btn--sm" type="button" id="aiReviewButton">AI ilə yoxla</button>
      </div>
      <p class="text-sm" id="aiReviewStatus"></p>
      <p class="text-xs text-muted">AI rəyi sualları dəyişmir: təklifə baxıb özünüz tətbiq edirsiniz.</p>
    </div>

    <div id="content"></div>
  </section>

</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { subjectLabel } from './assets/js/subjects.js';
  import {
    REVIEW_ORDER, SOURCE_ORDER,
    findingsByQuestion, orderedIndexes, setWideFindings,
    severityBadge, suspiciousCount,
  } from './assets/js/question-review.js';
  import { LEVELS, levelBadgeClass, levelLabel, predictionLine, summaryLine } from './assets/js/difficulty.js';
  import { reviewByQuestion, reviewStatusLine, suggestionPatch, verdictBadge } from './assets/js/ai-review.js';

  const LETTERS = 'ABCDE';

  if (requireLogin()) {
    mountShell();

    const setId = Number(new URLSearchParams(window.location.search).get('id'));
    const content = document.getElementById('content');
    const errorBox = document.getElementById('errorBox');
    const okBox = document.getElementById('okBox');
    const auditBox = document.getElementById('audit');

    function flash(box, text) {
      box.textContent = text;
      box.hidden = false;
      setTimeout(() => { box.hidden = true; }, 4000);
    }

    if (!Number.isInteger(setId) || setId <= 0) {
      errorBox.textContent = 'Sual bankı ünvanı düzgün deyil.';
      errorBox.hidden = false;
    } else {
      let bankMix = null;     // «30/50/20»; köhnə bankda `null`
      request(`/live/question-sets/${setId}`)
        .then((set) => {
          bankMix = set.difficulty_mix || null;
          renderDifficultySummary();
          document.getElementById('setTitle').textContent = set.title;
          const hint = document.createElement('span');
          hint.className = 'section-header__hint';
          hint.textContent = `${subjectLabel(set.subject)} · ${set.question_count} sual`;
          document.getElementById('setTitle').after(hint);
        })
        .catch(() => {});

      /* ---- Keyfiyyət auditi ----
         Ekranın ƏSAS DƏYİŞİKLİYİ budur. Əvvəl səhifə 30 sualın hamısını
         açıq forma kimi düzürdü: müəllim sualı OXUYA bilmirdi, çünki
         mətn textarea-nın içində idi, və hansından başlamalı olduğunu
         bilmirdi. İndi suallar OXUNAQLI kart kimi göstərilir, redaktə
         yalnız tələb olunanda açılır, sıra isə auditə görə qurula bilir. */

      /* Çətinlik xülasəsi: AI bölgünü həmişə DƏQİQ tuta bilmir (material
         qısadırsa qonşu səviyyədən doldurur), müəllim fərqi burada görür. */
      const difficultySummary = document.createElement('p');
      difficultySummary.className = 'text-sm text-muted';
      difficultySummary.hidden = true;
      auditBox.before(difficultySummary);
      function renderDifficultySummary() {
        if (!questions.length) { difficultySummary.hidden = true; return; }
        difficultySummary.textContent = `Çətinlik: ${summaryLine(questions, bankMix)}`;
        difficultySummary.hidden = false;
      }

      let quality = null;      // `GET .../quality` cavabı, uğursuz olsa `null`
      let aiReview = null;     // `GET .../review` cavabı (gün 10), uğursuz olsa `null`
      let aiPoll = null;
      const aiBox = document.getElementById('aiReview');
      const aiButton = document.getElementById('aiReviewButton');
      const aiStatus = document.getElementById('aiReviewStatus');

      function loadAiReview() {
        return request(`/live/question-sets/${setId}/review`)
          .then((review) => { aiReview = review; })
          .catch(() => { aiReview = null; });
      }

      function renderAiReview() {
        aiBox.hidden = !questions.length;
        const processing = aiReview && aiReview.status === 'processing';
        aiStatus.textContent = reviewStatusLine(aiReview, questions.length);
        aiStatus.className = aiReview && aiReview.status === 'failed' ? 'text-sm qcard__finding' : 'text-sm';
        aiButton.disabled = processing;
        aiButton.textContent = processing ? 'Yoxlanır...'
          : (aiReview && aiReview.status === 'ready' ? 'Yenidən yoxla' : 'AI ilə yoxla');
        clearTimeout(aiPoll);
        if (processing) {
          aiPoll = setTimeout(async () => {
            await loadAiReview();
            if (aiReview && aiReview.status !== 'processing') renderList(); else renderAiReview();
          }, 3000);
        }
      }

      aiButton.addEventListener('click', async () => {
        aiButton.disabled = true;
        try {
          aiReview = await request(`/live/question-sets/${setId}/review`, { method: 'POST' });
        } catch (error) {
          flash(errorBox, error.message);
          await loadAiReview();
        }
        // Siyahı da yenidən çəkilir: köhnə yoxlamanın nişanları yeni yoxlama gedərkən qalmamalıdır.
        renderList();
      });
      let questions = [];
      let order = SOURCE_ORDER;

      function auditLine(text, className) {
        const line = document.createElement('p');
        line.className = className;
        line.textContent = text;
        return line;
      }

      function renderAudit() {
        auditBox.innerHTML = '';
        if (!quality || !questions.length) { auditBox.hidden = true; return; }
        auditBox.hidden = false;

        const suspicious = suspiciousCount(quality.findings);
        const head = document.createElement('div');
        head.className = 'row row--between';
        const summary = document.createElement('strong');
        summary.textContent = suspicious
          ? `${questions.length} sualdan ${suspicious}-i şübhəlidir`
          : `${questions.length} sualda şübhə əlaməti tapılmadı`;
        head.append(summary);

        // Sıralama düyməsi yalnız şübhəli sual VARSA mənalıdır.
        if (suspicious) {
          const toggle = document.createElement('button');
          toggle.className = 'btn btn--secondary btn--sm';
          toggle.type = 'button';
          toggle.textContent = order === REVIEW_ORDER ? 'Mənbə sırası' : 'Şübhəlidən başla';
          toggle.addEventListener('click', () => {
            order = order === REVIEW_ORDER ? SOURCE_ORDER : REVIEW_ORDER;
            renderList();
          });
          head.append(toggle);
        }
        auditBox.append(head);

        for (const finding of setWideFindings(quality.findings)) {
          auditBox.append(auditLine(finding.message, 'text-sm audit__set-finding'));
        }

        /* Bu cümlə QƏSDƏN həmişə göstərilir. Audit cavabın DOĞRU
           olduğunu yoxlaya bilmir (bax `pipeline/quality.py` modul
           qeydi) - «tapıntı yoxdur» sualın təsdiqlənməsi kimi
           anlaşılsa, alət faydadan çox zərər verər. */
        auditBox.append(auditLine(
          'Audit yalnız şübhə əlamətlərini sayır - cavabın doğruluğunu yoxlaya bilmir.',
          'text-xs text-muted',
        ));
      }

      function loadQuality() {
        return request(`/live/question-sets/${setId}/quality`)
          .then((report) => { quality = report; })
          .catch(() => { quality = null; });   // audit səhifəni bloklamır
      }

      /* ---- Bir sualın kartı ---- */

      function optionRow(text, letter, isCorrect) {
        const row = document.createElement('div');
        row.className = isCorrect ? 'option option--correct' : 'option';
        const mark = document.createElement('span');
        mark.className = 'option__letter';
        mark.textContent = letter;
        const body = document.createElement('span');
        body.textContent = text;
        row.append(mark, body);
        if (isCorrect) {
          // Rəngdən ƏLAVƏ mətn siqnalı: yalnız rəng kifayət deyil.
          const tag = document.createElement('span');
          tag.className = 'badge badge--success option__mark';
          tag.textContent = 'Düzgün';
          row.append(tag);
        }
        return row;
      }

      function buildAiNotes(question, number, item) {
        const box = document.createElement('div');
        box.className = 'stack stack--tight qcard__ai';
        for (const issue of item.issues) {
          const note = document.createElement('p');
          note.className = 'text-sm qcard__finding';
          note.textContent = `${issue.agent_label}: ${issue.text}`;
          box.append(note);
        }
        const suggestion = item.suggestion;
        if (suggestion) {
          const head = document.createElement('p');
          head.className = 'text-sm';
          head.append(Object.assign(document.createElement('strong'), { textContent: 'Redaktorun təklifi' }));
          box.append(head);
          const text = document.createElement('p');
          text.className = 'qcard__question';
          text.textContent = suggestion.question;
          box.append(text);
          suggestion.options.forEach((option, i) => {
            box.append(optionRow(option, LETTERS[i], i === suggestion.correct_index));
          });
          if (suggestion.explanation) {
            box.append(Object.assign(document.createElement('p'), {
              className: 'text-sm text-muted', textContent: `İzah: ${suggestion.explanation}` }));
          }
          const apply = document.createElement('button');
          apply.type = 'button';
          apply.className = 'btn btn--primary btn--sm';
          apply.textContent = 'Təklifi tətbiq et';
          apply.addEventListener('click', async () => {
            apply.disabled = true;
            try {
              await request(`/live/questions/${question.id}`, {
                method: 'PATCH', body: suggestionPatch(suggestion, question.difficulty) });
              flash(okBox, `Sual ${number} təklifə görə yeniləndi.`);
              await reload();
            } catch (error) {
              flash(errorBox, error.message);
              apply.disabled = false;
            }
          });
          box.append(apply);
        }
        return box;
      }

      function buildCard(question, number, findings, aiItem) {
        const card = document.createElement('div');
        card.className = 'card stack stack--tight qcard';

        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        title.textContent = `Sual ${number}`;
        const tools = document.createElement('div');
        tools.className = 'row row--tight';
        for (const finding of findings) {
          const badge = severityBadge(finding.severity);
          const chip = document.createElement('span');
          chip.className = badge.className;
          chip.textContent = badge.label;
          chip.title = finding.message;
          tools.append(chip);
        }
        if (aiItem) {
          const badge = verdictBadge(aiItem.verdict);
          tools.append(Object.assign(document.createElement('span'), {
            className: badge.className, textContent: badge.label }));
        }
        const level = document.createElement('span');
        level.className = levelBadgeClass(question.difficulty);
        level.textContent = levelLabel(question.difficulty);
        tools.append(level);
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn--secondary btn--sm';
        editBtn.type = 'button';
        editBtn.textContent = 'Redaktə et';
        tools.append(editBtn);
        head.append(title, tools);

        const readBody = document.createElement('div');
        readBody.className = 'stack stack--tight';
        const text = document.createElement('p');
        text.className = 'qcard__question';
        text.textContent = question.question;
        readBody.append(text);
        for (let i = 0; i < question.options.length; i += 1) {
          readBody.append(optionRow(question.options[i], LETTERS[i], i === question.correct_index));
        }
        if (question.explanation) {
          const explanation = document.createElement('p');
          explanation.className = 'text-sm text-muted';
          explanation.textContent = `İzah: ${question.explanation}`;
          readBody.append(explanation);
        }
        const prediction = predictionLine(question);
        if (prediction) {
          readBody.append(Object.assign(document.createElement('p'), {
            className: 'text-xs text-faint', textContent: prediction }));
        }

        /* Tapıntı mətni kartın ÖZÜNDƏDİR, oxu gövdəsində yox: müəllim
           redaktəni məhz tapıntını düzəltmək üçün açır - forma açılanda
           problemin nə olduğu ekrandan yox olmamalıdır. */
        const notes = document.createElement('div');
        notes.className = 'stack stack--tight';
        for (const finding of findings) {
          const note = document.createElement('p');
          note.className = 'text-sm qcard__finding';
          note.textContent = finding.message;
          notes.append(note);
        }
        // Boş div flex sətri kimi sayılır və artıq boşluq yaradır.
        notes.hidden = findings.length === 0;

        const editBody = buildEditForm(question, number, card);
        editBody.hidden = true;

        editBtn.addEventListener('click', () => {
          const editing = editBody.hidden === false;
          editBody.hidden = editing;
          readBody.hidden = !editing;
          editBtn.textContent = editing ? 'Redaktə et' : 'Yoxlamağa qayıt';
        });

        // AI qeydi sualın ALTINDADIR: müəllim əvvəl sualı, sonra problemi və təklifi oxuyur.
        card.append(head, notes, readBody);
        if (aiItem && aiItem.verdict === 'fix') card.append(buildAiNotes(question, number, aiItem));
        card.append(editBody);
        return card;
      }

      /* ---- Redaktə forması ----
         Backend TAM 5 variant tələb edir (`UpdateQuestionRequest`,
         min_length=max_length=5) - sahə sayı sabitdir. */

      function labelledField(id, labelText, element) {
        const field = document.createElement('div');
        field.className = 'field';
        const label = document.createElement('label');
        label.className = 'field__label';
        label.htmlFor = id;
        label.textContent = labelText;
        element.id = id;
        field.append(label, element);
        return field;
      }

      function buildEditForm(question, number, card) {
        const form = document.createElement('form');
        form.className = 'stack';

        const questionInput = document.createElement('textarea');
        questionInput.className = 'field__textarea';
        questionInput.value = question.question;
        form.append(labelledField(`q-${question.id}`, 'Sual mətni', questionInput));

        const optionInputs = [];
        for (let i = 0; i < 5; i += 1) {
          const input = document.createElement('input');
          input.className = 'field__input';
          input.value = question.options[i] || '';
          form.append(labelledField(`q-${question.id}-o-${i}`, `Variant ${LETTERS[i]}`, input));
          optionInputs.push(input);
        }

        const correctSelect = document.createElement('select');
        correctSelect.className = 'field__select';
        for (let i = 0; i < 5; i += 1) {
          const option = document.createElement('option');
          option.value = String(i);
          option.textContent = LETTERS[i];
          if (i === question.correct_index) option.selected = true;
          correctSelect.append(option);
        }
        form.append(labelledField(`q-${question.id}-correct`, 'Düzgün cavab', correctSelect));

        const difficultySelect = document.createElement('select');
        difficultySelect.className = 'field__select';
        for (const value of LEVELS) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = levelLabel(value);
          if (value === (question.difficulty || 'orta')) option.selected = true;
          difficultySelect.append(option);
        }
        form.append(labelledField(`q-${question.id}-level`, 'Çətinlik', difficultySelect));

        const explanationInput = document.createElement('textarea');
        explanationInput.className = 'field__textarea';
        explanationInput.value = question.explanation || '';
        form.append(labelledField(`q-${question.id}-exp`, 'İzah', explanationInput));

        const actions = document.createElement('div');
        actions.className = 'row';
        const save = document.createElement('button');
        save.className = 'btn btn--primary btn--sm';
        save.type = 'submit';
        save.textContent = 'Yadda saxla';
        const remove = document.createElement('button');
        remove.className = 'btn btn--danger btn--sm';
        remove.type = 'button';
        remove.textContent = 'Sil';
        actions.append(save, remove);
        form.append(actions);

        /* Nəticə kartın İÇİNDƏ göstərilir. Əvvəl yalnız səhifənin ən
           yuxarısında görünürdü: 27-ci sualı saxlayan müəllim təsdiqi
           heç vaxt görmürdü. */
        const status = document.createElement('p');
        status.className = 'text-sm';
        status.hidden = true;
        form.append(status);

        function say(text, className) {
          status.className = `text-sm ${className}`;
          status.textContent = text;
          status.hidden = false;
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          save.disabled = true;
          try {
            await request(`/live/questions/${question.id}`, {
              method: 'PATCH',
              body: {
                question: questionInput.value,
                options: optionInputs.map((input) => input.value),
                correct_index: Number(correctSelect.value),
                explanation: explanationInput.value,
                difficulty: difficultySelect.value,
              },
            });
            say('Yadda saxlanıldı.', 'qcard__saved');
            flash(okBox, `Sual ${number} yadda saxlanıldı.`);
            // Audit dəyişmiş mətnə görə yenidən hesablanmalıdır, siyahı
            // isə yeni məzmunu göstərməlidir.
            await reload();
          } catch (error) {
            say(error.message, 'qcard__finding');
          } finally {
            save.disabled = false;
          }
        });

        remove.addEventListener('click', async () => {
          // Silinmə geri qaytarıla bilmir - təsdiq soruşulur.
          if (!window.confirm(`Sual ${number} silinsin?`)) return;
          remove.disabled = true;
          try {
            await request(`/live/questions/${question.id}`, { method: 'DELETE' });
            flash(okBox, `Sual ${number} silindi.`);
            card.remove();
            await reload();
          } catch (error) {
            say(error.message, 'qcard__finding');
            remove.disabled = false;
          }
        });

        return form;
      }

      /* ---- Siyahı ---- */

      function renderList() {
        content.innerHTML = '';
        renderAudit();
        renderAiReview();
        renderDifficultySummary();
        if (!questions.length) {
          content.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-notes"></use></svg></div>'
            + '<div class="state__title">Bu bankda sual yoxdur</div></div>';
          return;
        }
        const byQuestion = findingsByQuestion(quality && quality.findings);
        const byAi = reviewByQuestion(aiReview && aiReview.status === 'ready' ? aiReview : null);
        const list = document.createElement('div');
        list.className = 'stack';
        // Nömrə HƏMİŞƏ mənbə sırasındandır (index+1) - sıralama
        // dəyişəndə də «Sual 7» eyni sual qalmalıdır, əks halda müəllim
        // müzakirədə səhv suala istinad edər.
        for (const index of orderedIndexes(questions.length, quality && quality.review_order, order)) {
          const number = index + 1;
          list.append(buildCard(questions[index], number, byQuestion.get(number) || [],
            byAi.get(questions[index].id)));
        }
        content.append(list);
      }

      async function reload() {
        // AI rəyi də yenilənir: redaktə olunmuş sualın köhnə rəyini server silir.
        const [rows] = await Promise.all([
          request(`/live/question-sets/${setId}/questions`),
          loadQuality(),
          loadAiReview(),
        ]);
        questions = rows;
        renderList();
      }

      loadInto(
        content,
        async () => {
          const [rows] = await Promise.all([
            request(`/live/question-sets/${setId}/questions`),
            loadQuality(),
            loadAiReview(),
          ]);
          return rows;
        },
        (container, rows) => { questions = rows; renderList(); },
      );
    }
  }
</script>
</body>
</html>
