<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xülasələr - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031f" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031f">
<link rel="stylesheet" href="assets/css/base.css?v=20261031f">
<link rel="stylesheet" href="assets/css/components.css?v=20261031f">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Dərs xülasələri</h1>
      <span class="section-header__hint">Müəllimin dərc etdiyi qısa konspektlər</span>
    </div>
    <div id="content"></div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { subjectColorVar, subjectLabel } from './assets/js/subjects.js';
  import { readingMinutes, summaryStats } from './assets/js/summary.js';

  if (requireLogin()) {
    mountShell();

    function renderSummaries(container, summaries) {
      container.innerHTML = '';
      if (!summaries.length) {
        container.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-file-text"></use></svg></div>'
          + '<div class="state__title">Xülasə yoxdur</div>'
          + '<div class="state__text">Müəlliminiz dərs xülasəsini çata dərc edəndə burada görünəcək.</div></div>';
        return;
      }
      /* 2026-10-31: kart bütövlükdə linkdir - fənn nişanı, başlıq, girişin
         ilk sətirləri və nə qədər məzmun olduğu (oxumağa dəyərmi?). */
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const grid = el('div', 'grid');
      for (const summary of summaries) {
        const content = summary.content || {};
        const card = el('a', 'card card--interactive summary-card');
        card.href = `xulase.html?id=${encodeURIComponent(summary.id)}`;

        const top = el('div', 'summary-card__foot');
        const chip = el('span', 'chip-subject', subjectLabel(summary.subject));
        chip.style.setProperty('--subject', subjectColorVar(summary.subject));
        top.append(chip, el('span', 'text-xs text-faint', `${readingMinutes(summary.content)} dəq oxu`));
        card.append(top, el('h2', 'summary-card__title', content.title || summary.title));
        if (content.intro) card.append(el('p', 'summary-card__intro', content.intro));

        const foot = el('div', 'summary-card__foot');
        const date = (summary.published_at || '').slice(0, 10);
        foot.append(el('span', 'text-xs text-muted',
          [summaryStats(summary.content), summary.chat_name, date].filter(Boolean).join(' · ')));
        foot.append(el('span', 'btn btn--primary btn--sm', 'Oxu'));
        card.append(foot);
        grid.append(card);
      }
      container.append(grid);
    }

    loadInto(document.getElementById('content'), () => request('/me/summaries'), renderSummaries);
  }
</script>
</body>
</html>
