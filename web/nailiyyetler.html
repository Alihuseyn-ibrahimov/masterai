<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nailiyyətlər - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261031d" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261031d">
<link rel="stylesheet" href="assets/css/base.css?v=20261031d">
<link rel="stylesheet" href="assets/css/components.css?v=20261031d">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Nailiyyətlərim</h1>
      <a class="btn btn--ghost btn--sm" href="tarixce.html">← Tarixçə</a>
    </div>
    <div id="content"></div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { sortBadges } from './assets/js/badges.js';
  import { createIcon } from './assets/js/icon.js';

  if (requireLogin()) {
    mountShell();

    function renderBadges(container, rows) {
      container.innerHTML = '';
      const badges = sortBadges(rows);
      const earned = badges.filter((badge) => badge.earned).length;

      const summary = document.createElement('p');
      summary.className = 'text-sm text-muted';
      summary.textContent = `${earned}/${badges.length} nişan qazanılıb`;
      container.append(summary);

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.style.setProperty('--grid-min', '220px');
      for (const badge of badges) {
        const card = document.createElement('div');
        card.className = 'card stack stack--tight';
        // Qazanılmamış nişan sönük görünür - amma GİZLƏNMİR, çünki
        // meyar özü motivasiyadır.
        if (!badge.earned) card.style.opacity = '0.55';

        /* REAL BUG İDİ: ikonun ADI mətn kimi yazılırdı (`textContent`),
           yəni ekranda nişanın şəkli yox, `seedling`/`bolt` kimi İNGİLİS
           SÖZÜ nəhəng hərflərlə görünürdü (brauzer render yoxlamasında
           tapıldı). Sprite (`assets/icons.svg`) bu beş ikonu onsuz da
           saxlayırdı - sadəcə JS ona bağlanmamışdı. */
        const icon = document.createElement('div');
        icon.className = 'state__icon';
        icon.append(createIcon(badge.icon));
        const title = document.createElement('h4');
        title.textContent = badge.label;
        const criteria = document.createElement('p');
        criteria.className = 'text-sm text-muted';
        criteria.textContent = badge.criteria;
        card.append(icon, title, criteria);

        const status = document.createElement('span');
        if (badge.earned) {
          status.className = 'badge badge--success';
          status.textContent = badge.earnedAt
            ? `Qazanıldı · ${String(badge.earnedAt).slice(0, 10)}` : 'Qazanıldı';
        } else {
          status.className = 'badge badge--neutral';
          status.textContent = 'Hələ yox';
        }
        card.append(status);
        grid.append(card);
      }
      container.append(grid);
    }

    loadInto(document.getElementById('content'), () => request('/badges/me'), renderBadges);
  }
</script>
</body>
</html>
