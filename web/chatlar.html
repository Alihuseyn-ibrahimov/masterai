<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çatlar - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css?v=20260912a">
<link rel="stylesheet" href="assets/css/base.css?v=20260912a">
<link rel="stylesheet" href="assets/css/components.css?v=20260912a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Çatlar</h1>
      <span class="section-header__hint">Qrup çatında dostlarla birgə test həll edin</span>
    </div>
    <div id="content"></div>
  </section>

  <!-- AYRICA BÖLMƏ BAŞLIĞI: əvvəl bu iki forma çat kartları ilə eyni
       şəbəkədə idi və siyahının davamı kimi oxunurdu. -->
  <section class="stack">
    <div class="section-header">
      <h2>Yeni çat və ya qoşulma</h2>
    </div>
    <div class="grid" style="--grid-min: 280px">
    <div class="card stack">
      <h4>Yeni qrup çatı</h4>
      <div class="notice notice--danger" id="createError" role="alert" hidden></div>
      <form class="stack stack--tight" id="createForm">
        <div class="field">
          <label class="field__label" for="chatName">Çatın adı</label>
          <input class="field__input" id="chatName" name="name" required maxlength="100"
                 placeholder="Məsələn: Qanunvericilik qrupu">
        </div>
        <button class="btn btn--primary" type="submit" id="createBtn">Yarat</button>
      </form>
    </div>

    <div class="card stack">
      <h4>Mövcud çata qoşul</h4>
      <p class="text-sm text-muted">
        Müəllimin verdiyi 6 simvollu dəvət kodunu yazın. Qoşulma müəllim
        təsdiqlədikdən sonra tamamlanır - müəllimin ekranında istəyiniz
        10 saniyə ərzində görünür.
      </p>
      <div class="notice notice--danger" id="joinError" role="alert" hidden></div>
      <div class="notice notice--success" id="joinOk" role="status" hidden></div>
      <form class="stack stack--tight" id="joinForm">
        <div class="field">
          <label class="field__label" for="inviteCode">Dəvət kodu</label>
          <input class="field__input invite-code" id="inviteCode" name="code"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 required maxlength="7" placeholder="K7M-3QX">
        </div>
        <button class="btn btn--secondary" type="submit" id="joinBtn">İstək göndər</button>
      </form>
    </div>
    </div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { createIcon } from './assets/js/icon.js';
  import { formatCode, isCompleteCode, normalizeCode } from './assets/js/invite-code.js';

  if (requireLogin()) {
    mountShell();

    const content = document.getElementById('content');

    /* Çatın dəvət kodu backend tərəfdən YALNIZ yaradana göndərilir
       (bax `app.py`, `_chat_info_for`). Yəni kodun mövcudluğu özü
       «bu çatı mən yaratmışam» əlamətidir - ayrıca yoxlama lazım
       deyil və iki mənbə arasında uyğunsuzluq riski yoxdur. */
    const isOwner = (chat) => Boolean(chat.invite_code);

    function emptyState() {
      const state = document.createElement('div');
      state.className = 'state';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'state__icon';
      iconWrap.append(createIcon('message'));
      const title = document.createElement('div');
      title.className = 'state__title';
      title.textContent = 'Hələ çatınız yoxdur';
      const hint = document.createElement('div');
      hint.className = 'state__text';
      hint.textContent = 'Aşağıdan yeni qrup çatı yaradın və ya müəlliminizin '
        + 'verdiyi dəvət kodu ilə istək göndərin.';
      state.append(iconWrap, title, hint);
      return state;
    }

    /** Kartın başlıq sətri - çat səhifəsinə keçid. AYRICA <a>-dır,
     *  çünki kartın içində düymələr var: bütün kartı <a> etsək,
     *  «Təsdiqlə» düyməsinə toxunanda səhifə dəyişərdi. */
    function cardTitleLink(chat) {
      const link = document.createElement('a');
      link.className = 'row row--between';
      link.href = `chat.html?id=${encodeURIComponent(chat.id)}`;
      const title = document.createElement('h4');
      // Qəsdən textContent - çatın adını istifadəçi yazır.
      title.textContent = chat.name || (chat.kind === 'direct' ? 'Şəxsi çat' : 'Adsız çat');
      link.append(title, createIcon('arrow-right'));
      return link;
    }

    /** Yalnız yaradana görünən blok: kod + yeniləmə + gözləyən istəklər. */
    function ownerPanel(chat, reload) {
      const box = document.createElement('div');
      box.className = 'stack stack--tight';

      const codeRow = document.createElement('div');
      codeRow.className = 'row row--between';
      const codeWrap = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'text-xs text-muted';
      label.textContent = 'Dəvət kodu';
      const code = document.createElement('div');
      code.className = 'invite-code';
      code.textContent = formatCode(chat.invite_code);
      codeWrap.append(label, code);

      const rotate = document.createElement('button');
      rotate.className = 'btn btn--ghost btn--sm';
      rotate.type = 'button';
      rotate.textContent = 'Kodu yenilə';
      rotate.addEventListener('click', async () => {
        // Geri dönüşü yoxdur: köhnə kod dərhal işləməz olur, yəni
        // sinifə artıq deyilmiş kod etibarsızlaşır.
        if (!globalThis.confirm('Köhnə kod dərhal işləməz olacaq. Davam edilsin?')) return;
        rotate.disabled = true;
        try {
          await request(`/chats/${chat.id}/invite-code`, { method: 'POST' });
          reload();
        } catch (error) {
          rotate.disabled = false;
          showCardError(box, error.message);
        }
      });
      codeRow.append(codeWrap, rotate);
      box.append(codeRow);

      const requests = document.createElement('div');
      requests.className = 'stack stack--tight';
      box.append(requests);
      requestPanels.push({ container: requests, chat });
      renderRequests(requests, chat, reload);
      return box;
    }

    function showCardError(container, message) {
      let notice = container.querySelector('.notice--danger');
      if (!notice) {
        notice = document.createElement('div');
        notice.className = 'notice notice--danger';
        notice.setAttribute('role', 'alert');
        container.append(notice);
      }
      notice.textContent = message;
      notice.hidden = false;
    }

    /* Yenilənən panellərin reyestri. Müəllim səhifəni açıq saxlayıb
       kodu sinifə deyir - istəklər O ANDA gəlir. Siyahı özü
       yenilənməsə, ekranda heç nə dəyişmir və müəllim «işləmir»
       nəticəsinə gəlir. (Real istifadədə məhz bu baş verdi.) */
    const requestPanels = [];

    async function renderRequests(container, chat, reload) {
      let rows;
      try {
        rows = await request(`/chats/${chat.id}/join-requests`);
      } catch (error) {
        showCardError(container, error.message);
        return;
      }
      container.innerHTML = '';
      if (!rows.length) {
        // Boş sətir QOYULUR: əks halda müəllim «istək yoxdur» ilə
        // «panel sınıqdır» arasında fərq qoya bilmir.
        const bos = document.createElement('p');
        bos.className = 'text-xs text-muted';
        bos.textContent = 'Gözləyən istək yoxdur.';
        container.append(bos);
        return;
      }

      const heading = document.createElement('div');
      heading.className = 'row row--between';
      const title = document.createElement('strong');
      title.className = 'text-sm';
      title.textContent = `Gözləyən istək: ${rows.length}`;
      heading.append(title);

      // «Hamısını təsdiqlə» yalnız bir neçə istək olanda mənalıdır -
      // tək sətirdə onsuz da «Təsdiqlə» düyməsi var.
      if (rows.length > 1) {
        const all = document.createElement('button');
        all.className = 'btn btn--primary btn--sm';
        all.type = 'button';
        all.textContent = 'Hamısını təsdiqlə';
        all.addEventListener('click', () => act(all, container, reload,
          `/chats/${chat.id}/join-requests/approve`,
          { user_ids: rows.map((row) => row.user_id) }));
        heading.append(all);
      }
      container.append(heading);

      for (const row of rows) {
        const line = document.createElement('div');
        line.className = 'request-row';
        const name = document.createElement('span');
        // Qəsdən textContent - adı istifadəçi özü yazır.
        name.textContent = row.display_name;

        const buttons = document.createElement('div');
        buttons.className = 'row row--tight';
        const approve = document.createElement('button');
        approve.className = 'btn btn--primary btn--sm';
        approve.type = 'button';
        approve.textContent = 'Təsdiqlə';
        approve.addEventListener('click', () => act(approve, container, reload,
          `/chats/${chat.id}/join-requests/approve`, { user_ids: [row.user_id] }));

        const decline = document.createElement('button');
        decline.className = 'btn btn--secondary btn--sm';
        decline.type = 'button';
        decline.textContent = 'Rədd et';
        decline.addEventListener('click', () => act(decline, container, reload,
          `/chats/${chat.id}/join-requests/${row.user_id}/decline`, undefined));

        buttons.append(approve, decline);
        line.append(name, buttons);
        container.append(line);
      }
    }

    async function act(button, container, reload, path, body) {
      button.disabled = true;
      try {
        await request(path, body === undefined ? { method: 'POST' } : { method: 'POST', body });
        reload();
      } catch (error) {
        button.disabled = false;
        showCardError(container, error.message);
      }
    }

    function renderChats(container, chats) {
      container.innerHTML = '';
      // Kartlar yenidən qurulur - köhnə panel istinadları artıq DOM-da
      // deyil, saxlanılsa yaddaşda ilişib qalardılar.
      requestPanels.length = 0;
      if (!chats.length) {
        container.append(emptyState());
        return;
      }
      const grid = document.createElement('div');
      // `--start`: kartların hündürlüyü bərabərləşməsin. Yaradanın
      // kartında kod + gözləyən istəklər var, adi üzvün kartında yox -
      // `stretch` olsa, ikincisi nəhəng boş qutu kimi görünür (real
      // render yoxlamasında məhz belə çıxdı).
      grid.className = 'grid grid--start';
      for (const chat of chats) {
        const card = document.createElement('div');
        card.className = 'card card--interactive stack stack--tight';
        card.append(cardTitleLink(chat));
        if (isOwner(chat)) {
          card.append(ownerPanel(chat, reload));
        } else {
          // Üzvə kod göstərilmir, amma kart tamam boş qalmamalıdır -
          // əvvəl burada «Qoşulma ID-si» yazılırdı (həmin axın silindi).
          const kind = document.createElement('p');
          kind.className = 'text-sm text-muted';
          kind.textContent = chat.kind === 'direct' ? 'Şəxsi çat' : 'Qrup çatı';
          card.append(kind);
        }
        grid.append(card);
      }
      container.append(grid);
    }

    const reload = () => loadInto(content, () => request('/chats'), renderChats);
    reload();

    /* Gözləyən istəklər hər 10 saniyədə özü yenilənir - `muellim.html`
       ilə EYNİ naxış. BÜTÜN səhifə yox, yalnız istək siyahıları
       yenilənir: `reload()` çağırsaydıq hər 10 saniyədə «Yüklənir…»
       spinneri yanıb-sönərdi.
       `document.hidden` - arxa fondakı sekmə sorğu göndərməsin. */
    const REQUEST_POLL_MS = 10000;
    setInterval(() => {
      if (document.hidden) return;
      for (const panel of requestPanels) {
        renderRequests(panel.container, panel.chat, reload);
      }
    }, REQUEST_POLL_MS);

    function wire(formId, buttonId, errorId, submit, onSuccess) {
      const form = document.getElementById(formId);
      const button = document.getElementById(buttonId);
      const errorBox = document.getElementById(errorId);
      const idle = button.textContent;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = 'Gözləyin…';
        try {
          const result = await submit(Object.fromEntries(new FormData(form).entries()));
          form.reset();
          if (onSuccess) onSuccess(result);
          reload();
        } catch (error) {
          errorBox.textContent = error.message;
          errorBox.hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = idle;
        }
      });
    }

    wire('createForm', 'createBtn', 'createError', (data) =>
      request('/chats', { method: 'POST', body: { kind: 'group', name: data.name } }));

    const codeInput = document.getElementById('inviteCode');
    const joinOk = document.getElementById('joinOk');
    // Yazarkən formatlama: ekranda `K7M-3QX` görünür, tələbə də eyni
    // görünüşü yazır. Normallaşdırma serverdə də var - bu, onu əvəz
    // etmir, sadəcə səhvi qabaqlayır.
    codeInput.addEventListener('input', () => {
      codeInput.value = formatCode(codeInput.value);
    });

    wire('joinForm', 'joinBtn', 'joinError', (data) => {
      joinOk.hidden = true;
      if (!isCompleteCode(data.code)) {
        // Natamam kodla sorğu yalnız sürət limitini yeyir (dəqiqədə 5).
        throw new Error('Dəvət kodu 6 simvoldan ibarətdir.');
      }
      return request('/chats/join-requests', {
        method: 'POST',
        body: { code: normalizeCode(data.code) },
      });
    }, (result) => {
      joinOk.textContent = result.chat_name
        ? `«${result.chat_name}» çatına istəyiniz göndərildi. Müəllim təsdiqləyəndən sonra görünəcək.`
        : 'İstəyiniz göndərildi. Müəllim təsdiqləyəndən sonra çat görünəcək.';
      joinOk.hidden = false;
    });
  }
</script>
</body>
</html>
