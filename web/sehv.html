<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Həllimi yoxla - MasterAI</title>
<meta name="theme-color" content="#0B0F18">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20261103a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20261103a">
<link rel="stylesheet" href="assets/css/base.css?v=20261103a">
<link rel="stylesheet" href="assets/css/components.css?v=20261103a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">
  <section class="stack">
    <div class="section-header">
      <h1>Həllimi yoxla</h1>
      <span class="section-header__hint">Səhv Detektivi</span>
    </div>
    <p class="text-sm text-muted">Həllinizi addım-addım yazın, hər sətirdə bir addım. Səhv Detektivi ilk səhv addımı və səhvin növünü tapır. Riyazi addımlar həm də hesabla yoxlanır. Həlliniz yadda saxlanmır.</p>
    <p class="text-sm text-muted" id="modelHint" hidden></p>

    <form class="card stack stack--tight" id="diagnoseForm">
      <label class="field__label" for="domain">Sahə</label>
      <select class="field__select" id="domain" required>
        <option value="riyaziyyat">Riyaziyyat</option>
        <option value="mentiq">Məntiq</option>
      </select>
      <label class="field__label" for="problem">Tapşırıq</label>
      <textarea class="field__textarea" id="problem" rows="2" maxlength="2000" required
                placeholder="Məs. 1/2 + 1/3 = ?"></textarea>
      <label class="field__label" for="solution">Həlliniz (hər sətir bir addım)</label>
      <textarea class="field__textarea" id="solution" rows="6" maxlength="5000" required
                placeholder="1/2 + 1/3&#10;= 2/5&#10;Cavab: 2/5"></textarea>
      <div class="bank__actions">
        <button class="btn btn--primary" type="submit" id="checkButton">Yoxla</button>
      </div>
    </form>

    <div class="notice notice--danger" id="errorBox" role="alert" hidden></div>

    <div class="card stack" id="resultCard" aria-live="polite" hidden>
      <div class="notice" id="verdict"></div>
      <ol class="stack stack--tight" id="stepList"></ol>
      <p id="explanation"></p>
      <p class="text-sm text-muted" id="sourceNote"></p>
    </div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { mountShell, requireLogin } from './assets/js/page-shell.js';
  import { sourceNote, splitSteps, stepMark, verdictOf } from './assets/js/diagnose.js';

  if (requireLogin()) {
    mountShell();

    const form = document.getElementById('diagnoseForm');
    const button = document.getElementById('checkButton');
    const errorBox = document.getElementById('errorBox');
    const card = document.getElementById('resultCard');
    const TONES = { correct: 'notice--success', wrong: 'notice--danger', unknown: 'notice--warning' };

    request('/me/diagnose').then((info) => {
      if (info.model_available) return;
      const hint = document.getElementById('modelHint');
      hint.textContent = 'AI model hazırda qoşulmayıb: yalnız hesab zəncirləri (kəsr, ifadə, tənlik) yoxlanır.';
      hint.hidden = false;
    }).catch(() => { /* məlumat sətiri vacib deyil */ });

    function render(result) {
      const verdict = verdictOf(result);
      const box = document.getElementById('verdict');
      box.className = `notice ${TONES[verdict.tone]}`;
      box.textContent = verdict.title;
      const list = document.getElementById('stepList');
      list.replaceChildren(...result.steps.map((step) => {
        const item = document.createElement('li');
        item.className = 'row';
        const text = document.createElement('span');
        text.textContent = step.text;
        if (step.status === 'after_error') text.className = 'text-muted';
        item.append(text);
        const mark = stepMark(step);
        if (mark) {
          const badge = document.createElement('span');
          badge.className = `badge ${mark.badge}`;
          badge.textContent = mark.label;
          item.append(badge);
        }
        return item;
      }));
      document.getElementById('explanation').textContent = result.explanation;
      document.getElementById('sourceNote').textContent = sourceNote(result);
      card.hidden = false;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      button.disabled = true;
      try {
        render(await request('/me/diagnose', {
          method: 'POST',
          body: {
            domain: document.getElementById('domain').value,
            problem: document.getElementById('problem').value.trim(),
            steps: splitSteps(document.getElementById('solution').value),
          },
        }));
      } catch (error) {
        card.hidden = true;
        errorBox.textContent = error.message;
        errorBox.hidden = false;
      } finally {
        button.disabled = false;
      }
    });
  }
</script>
</body>
</html>
