<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarixçə - MasterAI</title>
<meta name="theme-color" content="#141810">
<meta name="robots" content="noindex">
<!-- Brauzer nişanı. Olmasa brauzer /favicon.ico istəyir və hər
     səhifə yüklənişində 404 yaranır (render testində görüldü). -->
<link rel="icon" href="assets/icon.svg?v=20260930a" type="image/svg+xml">
<!-- Görünüş seçimi ilk boyamadan ƏVVƏL tətbiq olunur.
     NİYƏ İNLİNE: modul kimi yüklənsə brauzer əvvəlcə işıqlı ekranı
     çəkər, sonra tündə keçər - hər keçiddə ağ sıçrayış olar.
     Məntiq `assets/js/theme.js`-də, testlərlə örtülüdür; burada
     yalnız onun ən qısa forması təkrarlanır. -->
<script>
  try {
    var t = localStorage.getItem('masterai-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* yaddaş bloklanıb - cihaz seçimi qalır */ }
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260930a">
<link rel="stylesheet" href="assets/css/base.css?v=20260930a">
<link rel="stylesheet" href="assets/css/components.css?v=20260930a">
</head>
<body>
<header id="appBar"></header>
<div class="container app-shell stack stack--loose">

  <section>
    <div class="section-header">
      <h1>Mənim tarixçəm</h1>
      <a class="btn btn--ghost btn--sm" href="nailiyyetler.html"><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons.svg#i-trophy"></use></svg>Nailiyyətlər</a>
    </div>
    <div id="content"></div>
  </section>
</div>

<nav id="bottomNav"></nav>

<script type="module">
  import { request } from './assets/js/api.js';
  import { loadInto, mountShell, requireLogin } from './assets/js/page-shell.js';
  import { subjectColorVar, subjectLabel } from './assets/js/subjects.js';
  import { historySummary } from './assets/js/history.js';

  if (requireLogin()) {
    mountShell();

    function renderHistory(container, entries) {
      container.innerHTML = '';
      if (!entries.length) {
        container.innerHTML = '<div class="state"><div class="state__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chart-bar"></use></svg></div>'
          + '<div class="state__title">Hələ nəticəniz yoxdur</div>'
          + '<div class="state__text">Canlı sessiyada və ya ev tapşırığında iştirak edin.</div></div>';
        return;
      }
      /* Xülasə siyahıdan ƏVVƏL: siyahı «nə oldu»nu deyir, tələbəyə isə
         «nə etməliyəm» lazımdır. Zəif fənn yalnız kifayət qədər data
         olanda deyilir (bax `history.js` - az data üzərində yanlış
         yönləndirmə faydadan pisdir). */
      const summary = historySummary(entries);
      const brief = document.createElement('div');
      brief.className = 'audit';
      const line = document.createElement('strong');
      line.textContent = summary.percent === null
        ? `${summary.count} nəticə`
        : `${summary.count} nəticə · ${summary.score}/${summary.total} düzgün (${summary.percent}%)`;
      brief.append(line);
      if (summary.weakest) {
        const weak = document.createElement('p');
        weak.className = 'text-sm audit__set-finding';
        weak.textContent =
          `Ən zəif fənn: ${subjectLabel(summary.weakest.subject)} - ${summary.weakest.percent}%. Məşqi buradan başlayın.`;
        brief.append(weak);
      }
      container.append(brief);

      const list = document.createElement('div');
      list.className = 'stack stack--tight';
      // Ən yenilər yuxarıda.
      for (const entry of [...entries].sort((a, b) => String(b.date).localeCompare(String(a.date)))) {
        const card = document.createElement('div');
        card.className = 'card card--subject stack stack--tight';
        card.style.setProperty('--subject', subjectColorVar(entry.subject));

        const head = document.createElement('div');
        head.className = 'row row--between';
        const title = document.createElement('h4');
        title.textContent = entry.title;
        const kind = document.createElement('span');
        kind.className = entry.kind === 'live' ? 'badge badge--info' : 'badge badge--neutral';
        kind.textContent = entry.kind === 'live' ? 'Canlı sessiya' : 'Ev tapşırığı';
        head.append(title, kind);

        const meta = document.createElement('p');
        meta.className = 'text-sm text-muted';
        meta.textContent = `${subjectLabel(entry.subject)} · ${String(entry.date).slice(0, 10)}`;

        const score = document.createElement('div');
        score.className = 'stack stack--tight';
        const scoreRow = document.createElement('div');
        scoreRow.className = 'row row--between';
        const scoreText = document.createElement('span');
        scoreText.className = 'text-sm';
        scoreText.textContent = `${entry.score}/${entry.total_questions} düzgün`;
        scoreRow.append(scoreText);
        const bar = document.createElement('div');
        bar.className = 'progress';
        const fill = document.createElement('div');
        fill.className = 'progress__fill';
        const percent = entry.total_questions > 0
          ? Math.round((entry.score / entry.total_questions) * 100) : 0;
        fill.style.setProperty('--progress', `${percent}%`);
        fill.style.setProperty('--subject', subjectColorVar(entry.subject));
        bar.append(fill);
        score.append(scoreRow, bar);

        card.append(head, meta, score);
        list.append(card);
      }
      container.append(list);
    }

    loadInto(document.getElementById('content'), () => request('/history/me'), renderHistory);
  }
</script>
</body>
</html>
