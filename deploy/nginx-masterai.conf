# MasterAI — nginx reverse proxy (HTTPS-i certbot əlavə edir).
# /etc/nginx/sites-available/masterai → sites-enabled/ symlink,
# sonra: certbot --nginx -d masterai.SEND_DOMAIN
#
# `map` HTTP-səviyyəli direktivdir (server{} daxilində DEYİL) — bu fayl
# nginx.conf-un http{} blokunda include olunduğu üçün (sites-enabled/*),
# adi yerdə işləyir. WS handshake-i olmayan sorğularda "Connection: close"
# göndərir (adi HTTP keep-alive proxy-ni pozmamaq üçün standart naxış).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name masterai.SEND_DOMAIN;

    # WebSocket (/ws/chat/{id}) — uzunömürlü bağlantı, adi HTTP-dən daha
    # uzun timeout lazımdır (əks halda nginx aktiv söhbəti kəsər).
    location /ws/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 25M;    # material yükləmə (20 MB limit + ehtiyat)
    }

    listen 80;
}
