# MasterAI — nginx (HTTPS-i certbot əlavə edir).
#
# İki server bloku:
#   masterai.prdostu.com      → statik sayt + API (keçid dövrü üçün)
#   api.masterai.prdostu.com  → yalnız API
#
# NİYƏ API HƏR İKİ ADDA: mövcud n8n workflow-u və köhnə client-lər
# `masterai.prdostu.com`-a müraciət edir. Kök domendəki API yolları
# KEÇİD tədbiridir — hamı `api.` adına keçəndən sonra silinə bilər.
#
# Quraşdırma:
#   /etc/nginx/sites-available/masterai → sites-enabled/ symlink
#   certbot --nginx -d masterai.prdostu.com -d api.masterai.prdostu.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Backend-ə ötürmə qaydaları — hər iki server blokunda eynidir.
# `include` işlətmək üçün ayrıca fayl lazım gələrdi; təkrar qəsdəndir
# ki, konfiqurasiya tək fayl olaraq oxuna bilsin.

server {
    server_name masterai.prdostu.com;

    root /opt/masterai-web;
    index index.html;

    # API yolları — bu SİYAHI backend-in yol köklərini əhatə etməlidir.
    # Yeni ÜST SƏVİYYƏLİ endpoint əlavə edəndə bura da əlavə olunmalıdır;
    # `tests/test_nginx_routes.py` uyğunsuzluğu tutur.
    location ~ ^/(auth|admin|friends|chats|live|homework|history|badges|health|quiz)(/|$) {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 25M;    # material yükləmə (20 MB limit + ehtiyat)
    }

    # WebSocket — uzunömürlü bağlantı, uzun timeout tələb edir.
    location /ws/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Qalan hər şey statik saytdır.
    location / {
        try_files $uri $uri/ =404;
    }

    # Dizayn/kod faylları uzun keşlənir, HTML keşlənmir — əks halda
    # istifadəçi dəyişikliyi görmək üçün sərt təzələmə etməli olur.
    location ~* \.(css|js|svg|png|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    listen 80;
}

server {
    server_name api.masterai.prdostu.com;

    location /ws/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 25M;
    }

    listen 80;
}
