# Statik saytın sıxılması (http kontekstində, /etc/nginx/conf.d/-dən).
#
# Ubuntu-nun nginx.conf-u `gzip on;` yazır, amma `gzip_types` şərhdədir:
# yalnız text/html sıxılırdı. CSS/JS hər açılışda xam gedirdi (Lighthouse,
# 2026-11-01: «text compression» ~82 KiB, telefonda ilk boyama 2.9 s).
# Fayl nginx-masterai.conf-dan AYRIDIR: o fayl certbot-dan sonra yenidən
# yazılmır, bu isə rebuild_droplet.sh-in hər işində yenilənir.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript image/svg+xml
           application/json application/manifest+json text/plain;
