# Kurs Kassası pilot demosu - nginx (HTTPS-i certbot əlavə edir).
#
#   kassa.prdostu.com → /opt/kassa-demo/web (statik sayt surəti) + 127.0.0.1:8111
#
# Produksiyanın faylına (sites-available/masterai) TOXUNULMUR: bu AYRI fayldır,
# certbot da yalnız bu domenə işlədilir (`certbot --nginx -d kassa.prdostu.com`).
#
# DİQQƏT: `map $http_upgrade $connection_upgrade` bloku burada YOXDUR və olmamalıdır -
# o, nginx-masterai.conf-da artıq var; ikinci dəfə yazılsa `nginx -t` sınar və
# reload produksiyanı da dayandırar. `tests/test_kassa_deploy.py` qoruyur.
#
# Qoruma iki qatdır:
#   1. Statik səhifələr basic auth arxasındadır (link təsadüfən yayılsa sayt açılmır).
#   2. API yollarında basic auth SÖNÜLÜDÜR: tətbiq hər sorğuda öz
#      `Authorization: Bearer ...` başlığını göndərir, basic auth eyni başlığı istəyir və
#      hər API sorğusu 401 olardı. API onsuz da tətbiqin girişi ilə qorunur, Kassa yalnız
#      `is_admin`-ə açılır. Qeydiyyat bağlıdır: demoda yeni hesab yaranmır.

server {
    server_name kassa.prdostu.com;

    root /opt/kassa-demo/web;
    index index.html;

    auth_basic "Kurs Kassasi demo";
    auth_basic_user_file /etc/nginx/kassa-demo.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /auth/register {
        return 403;
    }

    # Siyahı nginx-masterai.conf ilə EYNİDİR (`tests/test_kassa_deploy.py` yoxlayır).
    location ~ ^/(auth|admin|friends|chats|live|homework|history|badges|health|quiz|me|owner)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 25M;
    }

    location /ws/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|svg|png)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen 80;
}
