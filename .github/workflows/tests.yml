name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Prod ilə eyni OCR paketləri (bax deploy/deploy_on_droplet.sh).
      - name: Sistem paketləri
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-aze

      - name: Python asılılıqları
        run: pip install -r requirements.txt

      # Kod yoxlayıcısının sandbox testləri (gün 19) tələbə kodunu bu image-də işlədir.
      - name: Sandbox image
        run: docker pull python:3.12-slim

      - name: pytest
        run: python -m pytest -q

      - name: JS testləri
        run: node --test web/tests/*.test.js
